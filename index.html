1, "Hábitos y productividad", "Decidir con calma", "●", "Fernando Mora (psiquiatra)", "Técnica de los 15 minutos: antes de actuar en caliente (contestar enfadado), para 15 minutos; ante una compra impulsiva, déjala 24 horas en el carrito.", "", "44:29", "https://www.youtube.com/watch?v=7NgYdZbxqHQ&t=2669s"], [1, "Hábitos y productividad", "Decidir con calma", "●", "Mark Rossini (ex agente del FBI)", "No digas que sí a todo: para, piensa y contesta al día siguiente; ve despacio, que las decisiones rápidas salen caras.", "", "01:45:40", "https://www.youtube.com/watch?v=oI7CDYNbbA4&t=6340s"], [1, "Hábitos y productividad", "Disciplina", "●", "Fausto Murillo (entrenador)", "Somos disciplinados en lo que nos gusta: si no te gusta el ejercicio, empieza por cogerle cariño.", "", "54:30", "https://www.youtube.com/watch?v=FF-onKxmDhI&t=3270s"], [1, "Hábitos y productividad", "Disciplina", "●", "Gerardo Ochoa (médico)", "La clave es disciplina frente a ilusión: la motivación de Año Nuevo se acaba; no abandones lo que ya te da resultados.", "", "01:36:43", "https://www.youtube.com/watch?v=SBnZPvXXcPU&t=5803s"], [1, "Hábitos y productividad", "Disciplina", "●", "Nate Gentile (divulgador tecnológico)", "Los hábitos sanos se encadenan: dales prioridad y hazlos innegociables («el gimnasio no es opcional»), con el tiempo y el cariño que necesitan.", "", "02:03:46", "https://www.youtube.com/watch?v=7QkQ8NYXZ1E&t=7426s"], [1, "Hábitos y productividad", "Disciplina", "●", "Patricio Ochoa (médico de longevidad)", "«No hay camino fácil»: ayudan hacerlo fácil, un castigo, la pasión y el vínculo emocional, pero para ser disciplinado sé honesto, fija un propósito claro y obsesiónate con él.", "", "26:20", "https://www.youtube.com/watch?v=aLhmN8sdTCg&t=1580s"], [1, "Hábitos y productividad", "Disciplina", "●", "Ricard Gutiérrez (analista financiero)", "Construir tu marca personal exige sacrificio, disciplina y trabajo.", "", "01:13:53", "https://www.youtube.com/watch?v=79Ypa2k36gk&t=4433s"], [1, "Hábitos y productividad", "Disciplina", "●", "Rodrigo Macías (numerólogo)", "Sostener un talento exige estudiar, prepararse, hacer ejercicio y alimentarse bien: «un gran poder conlleva una gran responsabilidad».", "", "01:09:50", "https://www.youtube.com/watch?v=kFfW86o1SQ4&t=4190s"], [1, "Hábitos y productividad", "Disciplina", "●", "Álvaro Hernández Jarque (experto en productividad)", "La pasión convertida en trabajo se quema: para continuar hacen falta disciplina, constancia, foco y esfuerzo.", "", "14:31", "https://www.youtube.com/watch?v=I4s5bFyCD6E&t=871s"], [1, "Hábitos y productividad", "Diseño del entorno", "✔", "Alejandro Kasuga (consultor kaizen)", "Para cambiar un hábito hacen falta conciencia, método y práctica; para el puesto de trabajo usa las 5S de Toyota: clasificar, ordenar, limpiar (comprobar que todo funciona y pensar cómo mejorar), estandarizar y mantener la disciplina con seguimiento diario.", "", "07:11", "https://www.youtube.com/watch?v=7RoH2XMjJ5Q&t=431s"], [1, "Hábitos y productividad", "Diseño del entorno", "✔", "Álvaro Hernández Jarque (experto en productividad)", "Para leer, deja el libro sobre la cama antes de ir a trabajar: si luego no lo lees, es una decisión consciente y no un olvido.", "", "01:18:16", "https://www.youtube.com/watch?v=I4s5bFyCD6E&t=4696s"], [1, "Hábitos y productividad", "Diseño del entorno", "●", "Andy Poberano (profesora de inglés)", "La mejor forma de cambiar un hábito es cambiar el entorno: rodéate de gente que ya lo practica (p. ej., deporte).", "", "13:17", "https://www.youtube.com/watch?v=dyOb3JKPdi8&t=797s"], [1, "Hábitos y productividad", "Diseño del entorno", "●", "Rodrigo Macías (numerólogo)", "El propósito «se riega con hábitos, entorno y estándares»: el entorno puede hacerte comer más azúcar o dejar el gimnasio; «somos el resultado de las cinco personas de las que nos rodeamos».", "", "01:48:28", "https://www.youtube.com/watch?v=kFfW86o1SQ4&t=6508s"], [1, "Hábitos y productividad", "Equilibrio vida-trabajo", "✔", "Patricio Ochoa (médico de longevidad)", "Vuelve siempre a lo básico (ejercicio, meditación, buena comida y conexión social) y no olvides a tus seres queridos por obsesión con el trabajo.", "", "01:04:18", "https://www.youtube.com/watch?v=aLhmN8sdTCg&t=3858s"], [1, "Hábitos y productividad", "Equilibrio vida-trabajo", "✔", "Álvaro Hernández Jarque (experto en productividad)", "Ponte objetivos sociales: al menos un día completo libre a la semana (el sábado) y un rato de conversación sin intención con familia o amigos; programa la socialización para el fin de semana, porque por trabajar demasiado puedes perder relaciones importantes.", "", "01:06:23", "https://www.youtube.com/watch?v=I4s5bFyCD6E&t=3983s"], [1, "Hábitos y productividad", "Equilibrio vida-trabajo", "●", "Nathaly Marcus (nutrióloga)", "Mira tu vida de forma integral («rueda del bienestar»): muchos hombres trabajan y se olvidan de sí mismos, sin hobbies, amigos ni propósito.", "", "27:44", "https://www.youtube.com/watch?v=M_eCjQKFRj8&t=1664s"], [1, "Hábitos y productividad", "Gestión del tiempo", "✔", "Álvaro Hernández Jarque (experto en productividad)", "Time blocking: tras priorizar, reserva bloques en el calendario; si la prioridad no está en el calendario, el hueco se llena con otra cosa.", "", "24:10", "https://www.youtube.com/watch?v=I4s5bFyCD6E&t=1450s"], [1, "Hábitos y productividad", "Gestión del tiempo", "●", "Álvaro Hernández Jarque (experto en productividad)", "Primer paso: una auditoría del tiempo; durante una semana, apunta en papel cada 30 minutos (con alarma) qué has hecho; esa semana rendirás menos, pero verás las fugas (interrupciones, notificaciones, llamadas inútiles).", "", "20:52", "https://www.youtube.com/watch?v=I4s5bFyCD6E&t=1252s"], [1, "Hábitos y productividad", "Gestión del tiempo", "●", "Álvaro Hernández Jarque (experto en productividad)", "Trabaja en bloques de unos 90 minutos con 20 de descanso activo (frente al Pomodoro de 25+5); en el descanso haz algo que  productividad", "Motivación", "●", "Andy Poberano (profesora de inglés)", "No te fijes solo en el resultado: disfruta el proceso y celebra las pequeñas batallas.", "", "01:15:22", "https://www.youtube.com/watch?v=dyOb3JKPdi8&t=4522s"], [1, "Hábitos y productividad", "Motivación", "●", "Luis Miguel Real (psicólogo de adicciones)", "Para perseguir una meta, busca un significado emocional (mejorar tu vida o la de los tuyos); si te mueve sobre todo el dinero, también es válido.", "", "07:13", "https://www.youtube.com/watch?v=YkmFg7XwpXA&t=433s"], [1, "Hábitos y productividad", "Motivación", "●", "Yago Sánchez (entrenador)", "Si te motiva más el cambio de medidas que el peso que levantas, usa la cinta métrica o el pantalón del verano pasado como motivación.", "", "46:42", "https://www.youtube.com/watch?v=XZh-unZxSfk&t=2802s"], [1, "Hábitos y productividad", "Objetivos", "●", "Christian Villar (coach)", "La mayoría no consigue nada porque no marca objetivos («una semana planeando las vacaciones y ni 5 minutos planeando su vida»): escribe tres objetivos para esta semana, ponlos a la vista, actúa, cambia de enfoque si no funciona y sé constante.", "", "25:25", "https://www.youtube.com/watch?v=QBP8Nmx_m6Q&t=1525s"], [1, "Hábitos y productividad", "Objetivos", "●", "Ricard Gutiérrez (analista financiero)", "Márcate un objetivo, haz tu lista y créate hábitos; date un capricho solo cuando el año ha sido bueno y guarda parte del extra.", "", "01:17:32", "https://www.youtube.com/watch?v=79Ypa2k36gk&t=4652s"], [1, "Hábitos y productividad", "Objetivos", "●", "Rodrigo Macías (numerólogo)", "Sostén cada objetivo con virtudes (humildad, orden, disciplina, perseverancia) y un hábito concreto para cada una: el qué, el cómo, el cuándo y el dónde.", "", "54:50", "https://www.youtube.com/watch?v=kFfW86o1SQ4&t=3290s"], [1, "Hábitos y productividad", "Objetivos", "●", "Álvaro Hernández Jarque (experto en productividad)", "Distingue tarea de objetivo: una tarea debe poder hacerse hoy; lo que no, es un objetivo; las tareas son tareas base que se repiten hasta lograr el objetivo, no el «to-do» del día.", "", "01:09", "https://www.youtube.com/watch?v=I4s5bFyCD6E&t=69s"], [1, "Hábitos y productividad", "Objetivos", "●", "Álvaro Hernández Jarque (experto en productividad)", "Un porqué puede ser material (un coche) o ayudar a tu familia: los motivos más potentes suelen ser los que no te benefician solo a ti.", "", "54:05", "https://www.youtube.com/watch?v=I4s5bFyCD6E&t=3245s"], [1, "Hábitos y productividad", "Objetivos", "⚠", "José Millán (físico y astrólogo)", "Empieza proyectos y relaciones en época de eclipse: la falta de luz externa obliga a «poner tu propia luz».", "astrología: sin evidencia científica", "01:33:50", "https://www.youtube.com/watch?v=Vd6-IkI3niM&t=5630s"], [1, "Hábitos y productividad", "Objetivos", "⚠", "Rodrigo Macías (numerólogo)", "Visualiza como una película, con todo detalle, la vida que quieres (en un avión, sin internet ni distracciones) y la versión de ti que ya lo logró; apóyalo con un tablero de visión o anotando objetivos.", "«manifestar» no tiene evidencia científica", "44:47", "https://www.youtube.com/watch?v=kFfW86o1SQ4&t=2687s"], [1, "Hábitos y productividad", "Objetivos: método de las tres hojas", "✔", "Álvaro Hernández Jarque (experto en productividad)", "Hoja 2, objetivos (en otro color): que sean medibles, alcanzables y con plazo (dar una charla de 30 minutos sin trabarte en una fecha concreta); de 3 a 5, mejor 3, porque cuantos más, menos se cumplen; si logras uno antes de tiempo, reajústalo al alza.", "", "56:23", "https://www.youtube.com/watch?v=I4s5bFyCD6E&t=3383s"], [1, "Hábitos y productividad", "Objetivos: método de las tres hojas", "●", "Álvaro Hernández Jarque (experto en productividad)", "Una vez al año (en diciembre, el 1 de enero o en septiembre) dedica un rato a tres hojas de papel: áreas (ver el bosque desde arriba), objetivos (el árbol desde una rama) y tareas («bajar a tierra»).", "", "45:39", "https://www.youtube.com/watch?v=I4s5bFyCD6E&t=2739s"], [1, "Hábitos y productividad", "Objetivos: método de las tres hojas", "●", "Álvaro Hernández Jarque (experto en productividad)", "Hoja 1, áreas: mira tu vida a vista de pájaro y elige 3-5 áreas (mejor 3: economía, salud y relaciones cubren casi cualquier vida); para cada una pregúntate el «por qué», que debe ser lo bastante grande para justificar el esfuerzo del año.", "", "48:42", "https://www.youtube.com/watch?v=I4s5bFyCD6E&t=2922s"], [1, "Hábitos y productividad", "Objetivos: método de las tres hojas", "●", "Álvaro Hernández Jarque (experto en productividad)", "No importa que quede bonito, importa hacerlo: pásalo a limpio y cuélgalo donde lo veas cada día; una hora de reflexión «te soluciona el año».", "", "50:51", "https://www.youtube.com/watch?v=I4s5bFyCD6E&t=3051s"], [1, "Hábitos y productividad", "Planificación y revisión", "●", "Marian Rojas Estapé (psiquiatra)", "Cada 6 meses haz una «puesta a punto» de tu vida (¿por dónde voy?, ¿qué mejorar?) sin pretender ser perfecto: la perfección es enemiga de lo bueno.", "", "01:21:50", "https://www.youtube.com/watch?v=3DW0y2w2Lmo&t=4910s"], [1, "Hábitos y productividad", "Planificación y revisión", "●", "Nathaly Marcus (nutrióloga)", "Prepara menús y comida el domingo: «no tienes tiempo de no tener tiempo» para el ejercicio, el médico y los hábitos.", "", "01:31:25", "https://www.youtube.com/watch?v=M_eCjQKFRj8&t=5485s"], [1, "Hábitos y productividad", "Planificación y revisión", "●", "Álvaro Hernández Jarque (experto en productividad)", "Haz una revisión semanal de 15 minutos el domingo, pon las prioridades en bloques de 90 minutos y anota cada noche el día siguiente.", "", "01:24:52", "https://www.youtube.com/watch?v=I4s5bFyCD6E&t=5092s"], [1, "Hábitos y productividad", "Procrastinación", "✔", "Luis Miguel Real (psicólogo de adicciones)", "La procrastinación es sobre todo emocional: pregúntate por qué necesitas hacer la tarea y por qué la evitas, y rebaja expectativas (40 minutos de cinta y unas pesas) para no evitarla.", "", "01:32:31", "https://www.youtube.com/watch?v=YkmFg7XwpXA&t=5551s"], [1, "Hábitos y productividad", "Procrastinación", "✔", "Álvaro Hernández Jarque (experto en productividad)", "La procrastinación funciona como un hábito (disparador, anhelo, acción, recompensa): reduce al máximo la fricción inicial (zapatillas bajo la cama, dormir con la ropa de deporte) y empieza con un hábito mínimo (10 minutos o una vuelta a la manzana) que vayas subiendo.", "", "01:17:34", "https://www.youtube.com/watch?v=I4s5bFyCD6E&t=4654s"], [1, "Hábitos y productividad", "Procrastinación", "●", "Andy Poberano (profesora de inglés)", "No te convenzas de que solo rindes bajo presión: procrastinar lleva a creerlo y se complica con los años.", "", "16:28", "https://www.youtube.com/watch?v=dyOb3JKPdi8&t=988s"], [1, "Hábitos y productividad", "Procrastinación", "●", "Álvaro Hernández Jarque (experto en productividad)", "Para estudiar o trabajar, comprométete a hacerlo solo 5 minutos: ponte delante de la hoja y escribe.", "", "01:21:11", "https://www.youtube.com/watch?v=I4s5bFyCD6E&t=4871s"], [1, "Hábitos y productividad", "Productividad", "●", "Gonzalo Alonso (directivo tecnológico)", "En las sesiones de ideas, supón que tienes todos los recursos, el talento y el apoyo de los jefes, para no frenar ninguna idea por miedo al juicio.", "", "01:04:41", "https://www.youtube.com/watch?v=JRchLV0sGaY&t=3881s"], [1, "Hábitos y productividad", "Productividad", "●", "Nicolás Luca de Tena (empresario)", "Aplica el KISS («Keep It Simple, Stupid»): lo que hagas, sencillo.", "", "08:54", "https://www.youtube.com/watch?v=Az2CUHGJKg8&t=534s"], [1, "Hábitos y productividad", "Productividad", "●", "Álvaro Hernández Jarque (experto en productividad)", "No sistematices lo que no hace falta: productividad es resultado dividido entre coste (tiempo, energía, dinero), y si algo no tiene sentido, no se hace.", "", "23:18", "https://www.youtube.com/watch?v=I4s5bFyC ps://www.youtube.com/watch?v=Vd6-IkI3niM&t=582s"], [1, "Aprender e idiomas", "Aprender toda la vida", "●", "Ricard Gutiérrez (analista financiero)", "Fórmate y recíclate continuamente, con IA o sin ella, en lo que te guste (batería, universidad o soldadura); no te quejes: adáptate y cabalga el cambio en vez de esperar «la paga».", "", "01:33:47", "https://www.youtube.com/watch?v=79Ypa2k36gk&t=5627s"], [1, "Aprender e idiomas", "Aprender toda la vida", "●", "Ricardo Salinas Pliego (empresario)", "La actitud es lo más importante, pero también la aptitud (estar preparado, tener herramientas); aprende de quien ya pasó por ello.", "", "02:43", "https://www.youtube.com/watch?v=yB88ugmkV6E&t=163s"], [1, "Aprender e idiomas", "Estudios y carrera", "⚠", "Covadonga Torres Assiego (jurista y profesora)", "No todo el mundo tiene que ir a la universidad: si no sabes qué haces en la carrera, déjala; «millonario no te vas a hacer» sin un proyecto propio.", "omite que el paro baja con el nivel de estudios", "59:58", "https://www.youtube.com/watch?v=ryoY5GizOUI&t=3598s"], [1, "Aprender e idiomas", "Estudios y carrera", "⚠", "Ramiro Iglesias (inversor)", "Estudia lo mínimo para empezar a trabajar cuanto antes en lo que quieres y hazlo internacional: «tres meses de prácticas valen más que un año de estudios».", "frase de efecto sin datos que la respalden", "38:07", "https://www.youtube.com/watch?v=vU7kzKIcpgo&t=2287s"], [1, "Aprender e idiomas", "Estudios y carrera", "⚠", "Xavier Verdaguer (emprendedor)", "Estudia lo que quieras, aunque no acabes la carrera, y vive experiencias emprendedoras: enseñan a trabajar en equipo, crear y comunicar.", "el valor del título depende mucho de la profesión", "09:45", "https://www.youtube.com/watch?v=SZ-J7NR0udk&t=585s"], [1, "Aprender e idiomas", "Inglés: escuchar y hablar", "✔", "Charly's Way (profesor de inglés)", "Los nativos dicen más «it’s not easy» que «it isn’t»; usa expresiones cotidianas como «leave your stuff here»: los libros enseñan un ?v=dyOb3JKPdi8&t=3346s"], [1, "Aprender e idiomas", "Inglés: método", "●", "Andy Poberano (profesora de inglés)", "Adapta el estudio a tu objetivo: si es hablar, practica speaking desde bases muy básicas y repasa lo ya visto, que da tranquilidad; si es leer papers, lee mucho.", "", "39:40", "https://www.youtube.com/watch?v=dyOb3JKPdi8&t=2380s"], [1, "Aprender e idiomas", "Inglés: método", "●", "Andy Poberano (profesora de inglés)", "No te «rayes» con la gramática: escucha y usa lo que te suene natural; ya habrá tiempo de ampliar vocabulario.", "", "58:56", "https://www.youtube.com/watch?v=dyOb3JKPdi8&t=3536s"], [1, "Aprender e idiomas", "Inglés: método", "●", "Andy Poberano (profesora de inglés)", "Con principiantes, simplifica (empieza con un simple «oh my god») y trabaja con imagen y asociación, siempre en voz alta.", "", "42:07", "https://www.youtube.com/watch?v=dyOb3JKPdi8&t=2527s"], [1, "Aprender e idiomas", "Inglés: método", "●", "Andy Poberano (profesora de inglés)", "Si tu objetivo es aprobar un examen oficial (FCE o First), ve a un centro especializado en exámenes; una academia de conversación te da herramientas para hablar, no para aprobar.", "", "01:17:22", "https://www.youtube.com/watch?v=dyOb3JKPdi8&t=4642s"], [1, "Aprender e idiomas", "Inglés: método", "●", "Charly's Way (profesor de inglés)", "Aprende como un niño: escucha, imita el sonido y no te preocupes al principio de cómo se escribe ni de la gramática; céntrate en entender y hablar.", "", "13:05", "https://www.youtube.com/watch?v=LJtiRXBFirU&t=785s"], [1, "Aprender e idiomas", "Inglés: método", "●", "Charly's Way (profesor de inglés)", "No memorices frases: quitarte ese peso te permite seguir aprendiendo.", "", "01:13:21", "https://www.youtube.com/watch?v=LJtiRXBFirU&t=4401s"], [1, "Aprender e idiomas", "Inglés: método", "⚠", "Andy Poberano (profesora de inglés)", "Hoy no aprendería un idioma por su cuenta: academia o profesor particular, porque alguien debe mantener el rumbo y es fácil desviars ión obligatoria: «es el padre y no el Estado el que tiene que controlar».", "", "48:22", "https://www.youtube.com/watch?v=ryoY5GizOUI&t=2902s"], [4, "Tecnología y dispositivos", "Hijos y pantallas", "●", "Sajeeva Hurtado (ginecóloga)", "No dejó móvil a su hijo hasta los 14 y después lo supervisó; enséñales a elegir a quién siguen: a nadie que les haga sentir peor o mejor que otros, sino a quien les motive.", "", "01:36:25", "https://www.youtube.com/watch?v=KhnjA7HYTOY&t=5785s"], [4, "Tecnología y dispositivos", "Algoritmos", "●", "Mesa redonda Debasa, Gutiérrez y Jiménez (historiador, economista y periodista)", "«Resiste al algoritmo»: YouTube te recomienda siempre lo mismo, así que escucha también a quien piensa distinto.", "", "02:45:31", "https://www.youtube.com/watch?v=sVq6afx2cyY&t=9931s"], [4, "Tecnología y dispositivos", "Papel y digital", "●", "Álvaro Hernández Jarque (experto en productividad)", "Piensa en papel antes de digitalizar: usa una libreta pequeña para capturar y otra grande para desarrollar, y luego pásalo a Notion, tareas o IA; se puede escribir en iPad, pero él prefiere el tacto del papel.", "", "01:33:08", "https://www.youtube.com/watch?v=I4s5bFyCD6E&t=5588s"], [4, "Tecnología y dispositivos", "Papel y digital", "●", "Marian Rojas Estapé (psiquiatra)", "Pasa a papel: ella escribe a mano lo que cuentan sus pacientes, sin ordenador ni teléfono, para no desconectarse de la conversación.", "", "01:11:07", "https://www.youtube.com/watch?v=3DW0y2w2Lmo&t=4267s"], [4, "Tecnología y dispositivos", "Videollamadas", "●", "Bárbara Tijerina (experta en comunicación no verbal)", "En videollamadas aleja la cámara (demasiado cerca es «distancia íntima») y mueve las manos aunque no se vean, porque dan ritmo a lo que dices.", "", "01:28:55", "https://www.youtube.com/watch?v=urfzGB-R1vo&t=5335s"], [4, "Tecnología y dispositivos", "Grabación de vídeo", "●", "Charly Sinewan (youtuber de viajes)", "Para grabar en ruta prueba con dos cámaras (delante y casco) en vez de cuatro: cuentas la historia igual y te ahorras copias y sincronización.", "", "02:27:02", "https://www.youtube.com/watch?v=goK6aVg1BT0&t=8822s"], [4, "Tecnología y dispositivos", "Evaluar tecnologías", "⚠", "Gonzalo Alonso (exdirectivo de Google)", "Para estimar el futuro de una tecnología, cuenta cuántos artículos científicos se publican sobre ella cada año: si siguen creciendo va bien; si la comunidad científica pierde interés, se estanca.", "Método propio; publicaciones no equivalen a valor de mercado", "01:31:25", "https://www.youtube.com/watch?v=JRchLV0sGaY&t=5485s"], [4, "Tecnología y dispositivos", "Kit de emergencia", "●", "José Luis Presa (instructor de supervivencia)", "En la mochila de emergencia lleva dos cables de carga, cargadores rápidos y cuatro linternas potentes con estrobo, de pila y de batería por si falla un tipo.", "", "01:17:05", "https://www.youtube.com/watch?v=MqZUm3R8qRY&t=4625s"], [4, "Tecnología y dispositivos", "Kit de emergencia", "●", "José Luis Presa (instructor de supervivencia)", "Cuelga la batería solar fuera de la mochila o usa un panel desplegable que la cubra para cargar más, y lleva un cargador USB con varios cabezales.", "", "01:32:29", "https://www.youtube.com/watch?v=MqZUm3R8qRY&t=5549s"], [4, "Tecnología y dispositivos", "Kit de emergencia", "⚠", "José Luis Presa (instructor de supervivencia)", "Recomienda añadir un par de minigeneradores eólicos, que «casi nadie usa y funcionan muy bien».", "Rendimiento incierto sin viento constante", "02:05:19", "https://www.youtube.com/watch?v=MqZUm3R8qRY&t=7519s"], [4, "Tecnología y dispositivos", "Apps útiles", "●", "Yago Heracles (entrenador y emprendedor)", "Usa el nivel del móvil para medir los grados reales de un banco inclinado: mucha gente cree que inclina y apenas lo hace.", "", "01:30:03", "https://www.youtube.com/watch?v=XZh-unZxSfk&t=5403s"]];const C=[["Salud", "salud"], ["Mente, hábitos y aprendizaje", "mente-habitos"], ["Finanzas", "finanzas"], ["Emprendimiento", "emprendimiento"], ["Tecnología e IA", "tecnologia"], ["Economía y mundo", "economia-mundo"]];const R={"0|Nutrición|Edulcorantes": "Díaz Rizzolo y Ochoa coinciden en que los edulcorantes sin calorías no suben la glucosa, pero chocan en lo demás: ella los ve mejores que el azúcar aunque alteren la microbiota, y él cree que las bebidas light pueden ser tan malas o peores que las normales.", "2|Ahorro y presupuesto|Comprar coche": "Coinciden en que el coche chino ya iguala o supera al alemán en tecnología; solo la mesa añade que es un 40 % más barato, y lo dice de oídas, sin datos de fiabilidad.", "4|Tecnología y dispositivos|Comprar dispositivos": "Solo Nate Gentile trata el tema: prima el chip y la autonomía de los Mac (MacBook Air como mejor compra) sobre los portátiles Windows baratos, el ecosistema al elegir auriculares y el catálogo al elegir consola; ningún otro experto lo contradice.", "3|Gestión y crecimiento|Promoción inmobiliaria": "Gil y Berral (PropHero) insisten en que el plazo es coste: las esperas de licencia y el tiempo apalancado encarecen la obra, y la prefabricación promete acortarlo, aunque admiten que con sus costes de 1.000-1.200 €/m² aún sale más cara que lo tradicional.", "2|Ingresos y carrera|Ingresos pasivos": "Gutiérrez enumera como rentas pasivas los inmuebles, la bolsa, los fondos y el staking de cripto, mientras Garza advierte de que no existe ingreso pasivo sin un ingreso activo previo que genere el capital.", "2|Inversión en bolsa y fondos|Asesoramiento y banca privada": "Gutiérrez y Luca de Tena coinciden en que los grandes patrimonios se delegan en banca privada o family offices, pero discrepan en el umbral: medio millón o un millón para la banca privada y un millón para un multifamily office.", "2|Vivienda e hipotecas|Amortizar o invertir": "Chocan: Cespedosa prefiere no amortizar una hipoteca barata e invertir ese dinero en fondos al 7-10 %, y Tubau cree que los bancos no hacen bien esos números y prefiere pagar con su dinero y no deber nada.", "5|Crisis e inflación|Ciclo y recesión": "Cava da indicadores concretos (balance de la Fed, bonos basura, PIB nominal frente a tipos) y Niño Becerra mira los grandes giros como la entrada de China en la OMC; nadie aporta pruebas de que sus reglas anticipen las recesiones.", "5|Crisis e inflación|Deuda pública": "Coinciden en que la deuda de EE. UU. (unos 40 billones) y su déficit (~6 % del PIB) son insostenibles; discrepan en cuánto pesan los intereses y en si Europa está igual de mal.", "5|Crisis e inflación|Dinero y bancos centrales": "Coinciden en que los bancos centrales fijan el precio del dinero y que desde 2008 y 2020 se ha creado mucho dinero, por lo que China y otros compran oro; chocan en las cifras de masa monetaria, casi todas mal calculadas o sin unidad.", "5|Crisis e inflación|Inflación y poder adquisitivo": "Todos coinciden en que el dinero parado pierde poder adquisitivo (unos 7.500 € de cada 10.000 en 10 años al 3 %) y conviene tener activos; chocan en la magnitud: Gutiérrez habla de perder un 12 % al año y Martínez de un 40 % en seis años, cifras infladas frente al IPC oficial.", "5|Geopolítica y energía|China": "Todos coinciden en que China sacó de la pobreza a unos 800 millones y que apuesta por ingenieros y sectores estratégicos (tierras raras, solar); chocan en su fuerza real: unos la ven imbatible por su sistema político y otros recuerdan que su renta per cápita sigue muy por detrás.", "5|Geopolítica y energía|Clima e incendios": "Coinciden en que el calor extremo es un hecho y en que el abandono rural agrava los incendios; Calero subraya que hoy mueren menos personas por el clima gracias a la tecnología, mientras Millán exagera la subida del mar.", "5|Geopolítica y energía|Comercio e industria en España": "Coinciden en que la industria del automóvil en España se está apoyando en fabricantes chinos y en que cerrarse al comercio encarece la vida; los datos de dependencia de China y de aranceles son dudosos.", "5|Geopolítica y energía|EE. UU. y potencias": "Jalife da reglas útiles (las elecciones de mitad de mandato las pierde el que gobierna, mirar el peso en STEM), pero varias de sus afirmaciones sobre EE. UU. contradicen hechos comprobables.", "5|Geopolítica y energía|Electricidad y renovables": "Calero y la mesa coinciden en que hacen falta fuentes firmes (gas y nuclear) porque la potencia renovable instalada no está disponible sin sol ni viento; nadie discute el abaratamiento solar por la sobreproducción china.", "5|Geopolítica y energía|España, Marruecos y OTAN": "Fonseca explica que la presión de Marruecos es «zona gris» y que Ceuta y Melilla quedan fuera del paraguas de la OTAN; sus cifras de gasto en defensa y de visados no cuadran.", "5|Geopolítica y energía|IA y regulación": "Coinciden en que la UE regula la IA más que EE. UU. y China (prohibiciones, alto riesgo y multas de hasta el 7 %) y en que Europa va por detrás en inversión y cómputo; chocan en si eso es bueno (Alonso) o un lastre (Ramió).", "5|Geopolítica y energía|Nuclear": "Calero es el único que habla de nuclear: residuos de baja actividad en El Cabril, almacén geológico para los de alta y unos 15-20 años para construir una central, frente a la rapidez china.", "5|Geopolítica y energía|Petróleo y Ormuz": "Coinciden en que por Ormuz pasa en torno al 20 % del petróleo y que cerrarlo encarece energía, fertilizantes y alimentos; chocan en los precios del barril (90, 100 o 200 $) y en la dependencia europea de Rusia.", "5|Geopolítica y energía|Rutas marítimas": "Jalife insiste en que la guerra actual es de «puntos de estrangulamiento» (Ormuz, Malaca, cables submarinos), pero sus porcentajes no tienen fuente.", "5|Demografía y sociedad|Educación y empleo": "Ambas mesas ven un problema de capital humano (peor nivel en PISA y muchísimos opositores), aunque la cifra de opositores es inverosímil.", "5|Demografía y sociedad|Natalidad": "Coinciden en que la natalidad cae en casi todo el mundo y que Israel es la excepción; chocan en las causas (cultura, ideología, ayudas o incorporación de la mujer) y fallan en datos de Marruecos, la India y Francia.", "5|Demografía y sociedad|Población y migración": "Coinciden en que España pierde talento formado y atrae mano de obra poco cualificada; Fabra pide a los jóvenes que se queden, mientras las cifras de población mundial que se dan están desfasadas.", "5|Demografía y sociedad|Vivienda y mano de obra": "Coinciden en que la vivienda depende de la oferta y de la población: Fabra pide suelo, oficios e industrializar la construcción y PropHero avisa de que sin crecimiento de población no hay revalorización.", "5|Preparación y emergencias|Agua y comida": "Presa insiste en almacenar agua en cuanto empiece un apagón (depósito plegable en la bañera), contar con que el inodoro no funcionará y tener cocina autónoma.", "5|Preparación y emergencias|Apagón": "Presa pide una radio de pilas o manivela, un power bank solar y efectivo para saber el alcance del apagón antes de actuar.", "5|Preparación y emergencias|Autodefensa": "Presa prioriza huir y el spray de pimienta homologado frente a la navaja; varias de sus ideas (palanca, trampas, revólver contra osos) chocan con la ley española.", "5|Preparación y emergencias|Fuego y refugio": "Presa da técnicas concretas de fuego (de fino a grueso, hoguera dakota) y refugio barato (capa, manta térmica, saco de verano como aislante), siempre con responsabilidad para no provocar incendios.", "5|Preparación y emergencias|Herramientas y cuerdas": "Presa prioriza herramientas ligeras y polivalentes (cuchillo de reserva, silbato, sierra, paracord, botiquín a mano) y avisa de que una cuerda sin saber nudos no sirve.", "5|Preparación y emergencias|Mochila de emergencia": "Presa insiste en tener la mochila de 72 horas hecha de antemano, con las «5 C», objetos de al menos tres usos y material bueno probado en el campo, aunque él mismo lleva objetos repetidos.", "5|Preparación y emergencias|Quedarse o irse": "Presa recomienda llegar primero a casa, decidir después si quedarse o irse y tener un punto B rural en comunidad, porque el superviviente solitario no aguanta.", "5|Preparación y emergencias|Riesgos locales": "Presa insiste en prepararse para los riesgos concretos de tu zona y en consultar los mapas públicos de inundación y sismicidad antes de elegir vivienda.", "5|Preparación y emergencias|Terremotos": "Presa coincide con Protección Civil en meterse bajo una mesa, no usar el ascensor y salir a un descampado, y descarta el «triángulo de la vida»; choca con la pauta oficial al recomendar ponerse junto a muros de carga.", "5|Historia, viajes y cultura|Historia económica": "Coinciden en que el crecimiento económico sostenido es reciente (desde la Revolución Industrial) y en que Asia pesó más que Europa hasta entonces; exageran al decir crecimiento «cero» y al dar hasta un 70 % del PIB mundial.", "5|Historia, viajes y cultura|Otros destinos": "Jalife recomienda San Petersburgo antes que Moscú y Vivas ir a Israel y Palestina para formarse una opinión propia, sin entrar en Gaza.", "5|Historia, viajes y cultura|Pensamiento crítico": "Coinciden en desconfiar de las fuentes interesadas y de los relatos sin pruebas (César sobre sí mismo, extraterrestres, sociedades secretas) y en separar lo demostrado de lo verosímil.", "5|Historia, viajes y cultura|Roma": "Iban Martín propone rincones gratuitos o con menos gente (Rinascente, Museos Capitolinos, templo de Venus y Roma) para ver Roma sin multitudes.", "5|Historia, viajes y cultura|Viajes en moto y aventura": "Sinewan recomienda empezar cerca (España, Portugal, Marruecos), salirse de las rutas comerciales como la Ruta 66 y viajar para conocer a la gente, no de fiesta en fiesta.", "3|Idea y validación|Elegir el problema": "Verdaguer insiste en que se parte del problema y no de la idea: entenderlo, empatizar con el usuario y acotarlo antes de idear; la tecnología es solo el medio.", "3|Idea y validación|MVP y piloto": "Verdaguer pide sacar pronto un producto mínimo y probarlo con usuarios reales, no con la familia, escuchando sus críticas en vez de intentar convencerlos.", "3|Idea y validación|Propuesta de valor": "Salinas, Luca de Tena y Verdaguer coinciden en que el negocio debe dar algo que el público pague; difieren en el cómo: servir al prójimo, ser distinto o innovar en sectores tradicionales.", "3|Idea y validación|Foco y nicho": "Todos coinciden: una sola cosa y un nicho concreto antes de ampliar (Villar, Serna, Luca de Tena), y saber decir que no (Jobs, según Gentile).", "3|Idea y validación|Empezar con poco riesgo": "Cespedosa y Garza proponen empezar sin jugártelo todo (mantener la nómina, vender servicios de baja barrera); el «flip» de Villar es la opción más arriesgada.", "3|Idea y validación|Modelos de negocio": "Serna avisa de que Amazon exige inversión inicial y la agencia no sirve para empezar de cero; Niño Becerra propone profesionalizar un hobby en el que seas el mejor.", "3|Equipo y socios|Emprender en equipo": "Verdaguer y Luca de Tena coinciden en no emprender solo; Luca de Tena propone arrancar con amigos y familia, incluso sin cobrar, lo que conviene dejar pactado por escrito.", "3|Equipo y socios|Delegar": "Luca de Tena, Garza, Iglesias y Verdaguer coinciden en que el fundador debe reconocer sus límites y delegar; Verdaguer añade conocer el perfil de cada uno (con un método sin base científica).", "3|Equipo y socios|Contratar": "Luca de Tena admite que se aprende a contratar equivocándose; Millán contrata por habilidades y actitud, no por títulos, y Salinas busca operadores con «madera».", "3|Equipo y socios|Liderazgo": "Coinciden en liderar con el ejemplo, cercanía y transparencia (Kasuga, Garza, Verdaguer); Macías añade que alguien tome siempre la decisión final.", "3|Equipo y socios|Feedback y evaluación": "Verdaguer propone feedback mensual entre socios y Salinas una evaluación anual con bonos; ambos piden hacerlo de forma sistemática.", "3|Ventas y marketing|Saber vender": "Salinas y Villar ven vender como la habilidad clave y piden salir a buscar clientes; Garza y Murillo recuerdan que se vende el resultado o productos asociados, no el servicio en sí.", "3|Ventas y marketing|Lenguaje no verbal": "Tijerina pide manos a la vista y adaptar la actitud a lo que necesita cada cliente.", "3|Ventas y marketing|Negociación": "Tijerina y Vizuete coinciden en bajar la tensión (respirar, pasear, buscar un interés común) y en buscar acuerdos donde ganen las dos partes.", "3|Ventas y marketing|Pitch y presentaciones": "Verdaguer, Alonso y Kasuga coinciden en que comunicar la idea es tan importante como tenerla: cuestionarla antes y presentarla de forma dinámica.", "3|Ventas y marketing|Storytelling y marca": "Vizuete y Alonso coinciden en que se vende la historia: cotidiana para conectar o de artesanía y conexión humana en el lujo.", "3|Ventas y marketing|Embudo y afiliación": "Serna propone aprender primero el embudo de ventas y empezar la afiliación por productos que ya conoces.", "3|Ventas y marketing|Contenido en redes": "Coinciden en constancia e iteración y en no complicarse al principio; chocan en el tono: Millán admite que vende el miedo, mientras Vivas pide no ser condescendiente y Charly avisa de que la comunidad te encasilla.", "3|Gestión y crecimiento|Estructura del negocio": "Salinas ordena el negocio en pasos: primero la estrategia pensada en el cliente y después una estructura con ventas por territorio.", "3|Gestión y crecimiento|Indicadores": "Salinas y Kasuga coinciden en medir lo que entrega cada parte del negocio y revisarlo con frecuencia (Salinas, cada semana).", "3|Gestión y crecimiento|Mejora continua": "Kasuga propone estabilizar, ordenar con 5S e implicar a quien hace el trabajo; su rechazo a documentar procesos en empresas pequeñas va contra la práctica habitual.", "3|Gestión y crecimiento|Escalar": "Salinas propone replicar la misma solución en más territorios; su idea de que salir a bolsa es para venderlo todo es discutible.", "3|Gestión y crecimiento|Financiación": "Cespedosa recomienda préstamos ICO y Luca de Tena pide no levantar capital antes de tiempo ni malvender participaciones sin asesorarse.", "3|Gestión y crecimiento|Productividad": "Hernández Jarque propone medir el tiempo, agrupar tareas por bloques y separar las herramientas personales de las de equipo.", "3|Mentalidad del emprendedor|Perfil del emprendedor": "Coinciden en que emprender es duro y exige sacrificio y no quejarse (Gutiérrez, Luca de Tena); Verdaguer añade que en EE. UU. el riesgo es aún mayor.", "3|Mentalidad del emprendedor|Dinero como consecuencia": "Luca de Tena y Garza coinciden en que el dinero llega por aportar valor, no por proponérselo como objetivo.", "3|Mentalidad del emprendedor|Resiliencia y críticas": "Salinas, Murillo y el lama Rinchen coinciden en tolerar el fracaso, buscar el sí e ignorar las críticas que desvían del camino.", "3|Mentalidad del emprendedor|Pensar en grande": "Villar pide ambición con arranque pequeño y Murillo que nunca es tarde; el «emprende ahora gracias a la IA» de Verdaguer es demasiado optimista.", "3|Mentalidad del emprendedor|Formación": "Coinciden en que el título solo abre la puerta y en formarse siempre por tu cuenta, con objetivos claros y contactos (Kasuga, Niño Becerra, Iglesias, Yago).", "3|Mentalidad del emprendedor|Decidir": "Garza da una regla rápida y sin evidencia, el lama Rinchen pide revisar si juegas el juego que elegiste y Charly avisa de que el momento perfecto no llega.", "2|Ahorro y presupuesto|Presupuesto": "Todos piden apuntar ingresos y gastos (Excel, diario o presupuesto) y mantener bajos los gastos fijos; Garza deja un 30 % para disfrutar y Tubau abandona el Excel cuando ya sabe que gasta menos de lo que gana.", "2|Ahorro y presupuesto|Cuánto ahorrar": "Coinciden en ahorrar una parte fija y empezar aunque sea poco; la cifra cambia: Merino pide un mínimo del 10 %, Tubau gastar como mucho cuatro de cada cinco, Iglesias un tercio y Gutiérrez y Niño Becerra «todo lo posible».", "2|Ahorro y presupuesto|Págate primero": "Garza y Villar coinciden en apartar primero el ahorro y gastar después lo que queda; Villar concreta un 20 % para invertir.", "2|Ahorro y presupuesto|Ahorro automático y cuentas": "Merino y Tubau coinciden en automatizar la transferencia al ahorro y al bróker; Merino además separa el dinero en unas 4 cuentas.", "2|Ahorro y presupuesto|Ahorro con objetivo": "Coinciden en ponerle al ahorro un destino concreto, con cifra y fecha, para que no se diluya.", "2|Ahorro y presupuesto|Recortar gastos": "Coinciden en que recortar es lo más rápido; Merino pide hacerlo «sin dolor» y Villar va más lejos: mudarse a una ciudad más barata.", "2|Ahorro y presupuesto|Compras impulsivas": "Coinciden en frenar el impulso con una regla (una compra al mes, pensar en horas de trabajo, desconfiar del «me lo merezco» y del logo).", "2|Ahorro y presupuesto|Mentalidad y para qué ahorrar": "Coinciden en que el ahorro compra libertad y tranquilidad más que cosas, y en saber decir «suficiente».", "2|Ahorro y presupuesto|Colchón de emergencia": "Todos ponen el colchón antes que la inversión; chocan en el tamaño: Ramió 3 meses, Gutiérrez 5-6 (mínimo 2-3) y Tubau un año entero de gastos.", "2|Ahorro y presupuesto|Dónde guardar el colchón": "Coinciden en cuenta remunerada, depósito o fondo monetario sin riesgo para el capital; Cespedosa es la única que mete un fondo de inversión, que sí tiene riesgo.", "2|Ahorro y presupuesto|Activos y pasivos": "Merino y Villar coinciden: un activo mete dinero en tu bolsillo y un pasivo lo saca.", "2|Ahorro y presupuesto|Dinero e hijos": "Tubau y Salinas coinciden en no dar a los hijos caprichos que no se hayan ganado.", "2|Ahorro y presupuesto|Juego y apuestas": "Coinciden en que la casa siempre gana a la larga y en usar el registro de autoprohibición si hay problema.", "2|Deuda y crédito|Tarjetas": "Garza insiste en pagar siempre a tiempo sin pagar intereses y en empezar con una tarjeta sin cuota anual.", "2|Deuda y crédito|Pagar deudas antes de invertir": "Garza y Villar coinciden: la deuda cara de tarjeta se paga antes de invertir, porque ninguna inversión rinde su interés.", "2|Deuda y crédito|Deuda buena y de consumo": "Tubau y Gutiérrez coinciden en que solo vale la deuda que genera más de lo que cuesta; Tubau no financiaría nunca un consumo.", "2|Deuda y crédito|Apalancamiento": "Chocan: Salinas ve la deuda como «una maravilla» con inflación y Gutiérrez avisa de que estar endeudado y sin ahorros en una crisis es el gran riesgo.", "2|Deuda y crédito|Préstamos pequeños, CIRBE e historial": "Coinciden en cuidar el historial: los pequeños préstamos suman y los ve el banco, y engañarle o no tener historial sale caro.", "2|Deuda y crédito|Pólizas y garantías": "Gutiérrez explica la póliza de crédito y Cespedosa recuerda que aportar más garantías abarata la financiación.", "2|Inversión en bolsa y fondos|Por qué invertir": "Coinciden en no dejar el dinero parado por la inflación; Villar lo plantea como «obligación» y Cava llama a la cuenta corriente la inversión más arriesgada.", "2|Inversión en bolsa y fondos|Fondos indexados": "Coinciden en el indexado (S&P 500 o MSCI World) como base; chocan en la rentabilidad esperada: Villar y Luca de Tena hablan de 12-15 %, por encima del 10 % histórico.", "2|Inversión en bolsa y fondos|Cartera de largo plazo": "Tubau propone una cartera global indexada 60/40, diversificar también la renta fija y no concentrarse en el Nasdaq; Gutiérrez añade un 5-10 % de liquidez.", "2|Inversión en bolsa y fondos|Diversificación": "Coinciden en no jugárselo todo a una carta: Merino con fondos y colchón, Gutiérrez con un 50 % en lo que va bien y Salinas con evitar el fracaso que te saque del juego.", "2|Inversión en bolsa y fondos|Núcleo y satélite": "Coinciden en un núcleo tranquilo y un satélite especulativo; chocan en el tamaño del satélite: 5 % Gutiérrez, 5-10 % Merino y hasta 40 % Ramió.", "2|Inversión en bolsa y fondos|Interés compuesto": "Todos defienden la paciencia y el interés compuesto, pero las cifras de Merino, Villar y Gustavo Martínez están mal calculadas o suponen rentabilidades irreales.", "2|Inversión en bolsa y fondos|Comisiones": "Tubau y Garza coinciden en que la gestión activa cara rara vez bate al índice; Villar exagera las comisiones del banco (5-6 %).", "2|Inversión en bolsa y fondos|Aportar cada mes o elegir momento": "PropHero, Merino y Gutiérrez piden estar invertido sin buscar el momento; Cava choca: concentraría las compras en marzo y septiembre.", "2|Inversión en bolsa y fondos|Comprar en caídas": "Coinciden en guardar liquidez para comprar en caídas; Gutiérrez da escalones (−20 %, −30 %, −40 %), Merino pide dejarlo escrito y Cava avisa de que puede seguir cayendo.", "2|Inversión en bolsa y fondos|Recoger beneficios": "Gutiérrez propone dejar correr lo que sube y retirar ganancias poco a poco cuando las valoraciones dejan de ser baratas.", "2|Inversión en bolsa y fondos|Dividendos": "Villar dice que dividendos o acumulación depende de la edad; Gutiérrez desconfía del dividendo si la acción cae.", "2|Inversión en bolsa y fondos|Cartera según la edad": "Chocan: Tubau baja la renta variable al acercarse a los 65, y Villar mantiene un 80-100 % en bolsa incluso a los 58 y los 75 años.", "2|Inversión en bolsa y fondos|Horizonte y objetivos": "Coinciden en fijar el horizonte antes de invertir; Tubau dice que bastan 10-20 años y acepta proyectos a 4-6 años en la cartera de largo plazo.", "2|Inversión en bolsa y fondos|Trading y especulación": "Iglesias y Gutiérrez desaconsejan el trading y avisan de las estafas; Cava, en cambio, enseña a especular con medias móviles y stops, siempre tras estudiar.", "2|Inversión en bolsa y fondos|Cuánto mirar la cartera": "Coinciden en mirar poco (una vez a la semana o menos) y no cambiar de estrategia por las noticias.", "2|Inversión en bolsa y fondos|Perfil de riesgo": "Coinciden en que la volatilidad es el precio de la rentabilidad y en no tratar la inversión como un juego; el perfil se descubre probando.", "2|Inversión en bolsa y fondos|Formarse antes de invertir": "Todos piden formarse antes de invertir; Luca de Tena prefiere delegar en expertos si no sabes.", "2|Oro, cripto y alternativas|Diversificar con oro y bitcoin": "Tubau, Gutiérrez y Gustavo Martínez añaden oro (y bitcoin o materias primas) a la bolsa; Martínez es el más agresivo con un 15-20 % en oro.", "2|Oro, cripto y alternativas|Oro": "Coinciden en tener algo de oro; chocan en cuándo: Cava compra solo en caídas y Martínez dice que siempre sube y no se vende nunca.", "2|Oro, cripto y alternativas|Oro físico": "Coinciden en que el físico evita la contraparte pero tiene costes (3 %, custodia); Cava y Martínez prefieren piezas pequeñas y Salinas un custodio segregado.", "2|Oro, cripto y alternativas|ETF y ETC de oro": "Coinciden en un producto respaldado por oro físico de un emisor grande; Cava prefiere uno que permita pedir el lingote.", "2|Oro, cripto y alternativas|Cuánto en cripto": "Chocan: Gutiérrez pone un máximo del 5-10 %, Ramió un mínimo del 3-5 %, Tubau admite hasta el 100 % a los 20 y Salinas un 50 % «conservador».", "2|Oro, cripto y alternativas|Qué cripto elegir": "Ramió se centra en bitcoin, ethereum y solana y en diversificar con proyectos analizados.", "2|Oro, cripto y alternativas|Entender antes de invertir": "Ramió e Iglesias coinciden en no invertir en lo que no sabes explicar; por eso Iglesias no tiene cripto.", "2|Oro, cripto y alternativas|Cuándo comprar cripto": "Ramió compra en las caídas y no vende para recomprar; Gutiérrez vende por niveles y ve la euforia de los amigos como señal de techo.", "2|Oro, cripto y alternativas|Rentabilidades prometidas": "Las cifras de Ramió (100 % anual, 20-30 % en DeFi) son promesas sin respaldo y llevan riesgo de pérdida total.", "2|Oro, cripto y alternativas|Cómo comprar cripto": "Ramió explica el paso del banco al exchange y pide empezar con poco, pero su afirmación de que todos los exchanges son seguros no se sostiene.", "2|Oro, cripto y alternativas|Custodia y riesgos": "Tubau y Calero coinciden en que existen riesgos (hackeo, claves, cuántica); Calero no los ve motivo para vender.", "2|Oro, cripto y alternativas|Capital privado": "Solo habla Iglesias, que vende estos fondos: sus explicaciones sirven, pero sus rentabilidades y la «ausencia de volatilidad» son de venta.", "2|Vivienda e hipotecas|Cuota máxima": "Coinciden en un tope de entre el 30 % y un tercio de los ingresos netos (Cespedosa cuenta todas las deudas juntas, 35 % en pareja); PropHero choca al pedir endeudarse al máximo.", "2|Vivienda e hipotecas|Antes de pedir hipoteca": "Coinciden en llegar con estabilidad laboral, cuentas limpias y ahorro previo; Tubau pide un año de sueldo y Cespedosa no financia más del 95 %.", "2|Vivienda e hipotecas|Tipo fijo o variable": "Coinciden en el fijo si una subida de cuota te ahoga; Cespedosa prefiere una mixta a 10 años si sabes de finanzas.", "2|Vivienda e hipotecas|Plazo de la hipoteca": "Chocan: Fabra no teme alargar el plazo porque se amortiza antes, y Cespedosa prefiere 20-25 años y no llegar a los 75 con hipoteca.", "2|Vivienda e hipotecas|Negociar la hipoteca": "Coinciden en comparar ofertas; chocan en cómo: PropHero pone la hipoteca «en subasta» y Cespedosa avisa de que el banco descarta la misma operación enviada por varios canales.", "2|Vivienda e hipotecas|Seguros vinculados": "Cespedosa pide leer los seguros vinculados y usarlos para negociar, haciendo la cuenta según edad e importe.", "2|Vivienda e hipotecas|Arras y comprobaciones": "Cespedosa pide revisar arras, nota simple y deudas de comunidad, y pactar 90 días hasta la escritura.", "2|Vivienda e hipotecas|Tasación y precio": "Coinciden en no pagar por encima del valor real: Cespedosa usa la tasación y Fabra los precios de escritura.", "2|Vivienda e hipotecas|Entrada y gastos de compra": "Coinciden en contar, además del 20 % de entrada, un 10-13 % de impuestos y gastos.", "2|Vivienda e hipotecas|Comprar o alquilar": "Coinciden en que depende de la estabilidad y la movilidad (alquilar al principio, comprar al asentarse); Cespedosa y PropHero empujan a comprar casi siempre.", "2|Vivienda e hipotecas|Primera vivienda": "Coinciden en que la primera casa no tiene que ser la definitiva: compra lo que puedas pagar y ve mejorando.", "2|Vivienda e hipotecas|Dónde comprar": "Coinciden en mirar la demografía y la periferia barata; PropHero añade un «comprar como sea» en las grandes capitales y su apuesta por la obra nueva.", "2|Vivienda e hipotecas|Cuándo comprar": "Cava y Gutiérrez coinciden en no endeudarse en plena euforia de crédito y precios y en no creer que los pisos nunca bajan.", "2|Vivienda e hipotecas|Rentabilidad del alquiler": "Coinciden en calcular la rentabilidad neta con todos los gastos; el 15 % vacacional de Villar se sale de lo normal.", "2|Vivienda e hipotecas|Comprar para invertir": "Coinciden en comprar por números y no por gusto; Merino avisa de que es casi un negocio y Villar promete acelerar la riqueza.", "2|Fiscalidad|Ganancias del ahorro": "Tubau pide vender poco a poco para tributar en los tramos bajos; Cava explica que pedir un préstamo con garantía no tributa.", "2|Fiscalidad|Venta de vivienda": "PropHero pide contar los impuestos de la ganancia antes de vender, pero su idea de usar una sociedad para esquivar Patrimonio no funciona sin más.", "2|Fiscalidad|Planificación fiscal": "Salinas insiste en planificar los impuestos, aunque su comentario sobre deducir intereses no vale para particulares en España.", "2|Jubilación y pensiones|Planificar la jubilación": "Merino pide una cifra objetivo y usa la regla del 4 % (25 veces el gasto anual), aunque calcula mal el ejemplo.", "2|Jubilación y pensiones|Pensión pública": "Coinciden en no fiarlo todo a la pensión pública.", "2|Jubilación y pensiones|Cartera cerca de la jubilación": "Tubau sigue ahorrando a los 50, no baja mucho el riesgo, retira poco a poco y quiere llegar a la jubilación con casa en propiedad.", "2|Ingresos y carrera|Ganar más": "Villar propone trabajos extra y aprender habilidades que se pagan; Salinas pide que el esfuerzo se note en el sueldo.", "2|Ingresos y carrera|Invertir en formación": "Coinciden en que de joven la mejor inversión es uno mismo, antes que la bolsa.", "2|Ingresos y carrera|Cursos milagro": "Coinciden en desconfiar del dinero rápido: trabajo, ahorro y 10-20 años.", "2|Ingresos y carrera|Emprender con colchón": "Tubau y Serna coinciden en emprender sin jugárselo todo: plan B, poco capital y sin préstamos.", "2|Ingresos y carrera|Elegir trabajo": "Coinciden en escucharse y especializarse; ninguno impone emprender, y para irse un tiempo piden prepararlo con excedencia o ahorros.", "2|Ingresos y carrera|Desarrollo profesional": "Coinciden en esfuerzo, objetivos y práctica (entrevistas, prácticas, herramientas de IA).", "1|Ansiedad y estrés|Ansiedad y pánico": "Coinciden en que la ansiedad es un mecanismo de defensa que se trata exponiéndose poco a poco y con terapia cognitivo-conductual; chocan en el alivio rápido: Mora propone distraerse mirando hacia fuera y Macías dice que ponerse a hacer algo «acaba» con ella, lo que la evidencia no respalda tanto.", "1|Ansiedad y estrés|Estrés": "Coinciden en que el estrés es normal si es agudo y acotado y en que se baja con lo que tú haces, no con pastillas ni masajes; Campillo admite el saco de boxeo como desahogo, aunque los estudios no ven que golpear calme.", "1|Ansiedad y estrés|Meditación": "Todos la recomiendan en dosis cortas (3-5 minutos o más) y centrada en la respiración, llevándola a la vida diaria; solo Ochoa avisa de que puede ser un «arma de doble filo».", "1|Ansiedad y estrés|Pensamientos y preocupaciones": "Coinciden en no pelearse con los pensamientos y en responderles con realismo (peor escenario, la mayoría nunca ocurre); chocan con Luca de Tena, que propone «disparar» a los malos pensamientos, algo que suele hacer que vuelvan.", "1|Ansiedad y estrés|Respiración": "Coinciden en que respirar despacio y de forma consciente calma el cuerpo (respiración en caja, respiraciones profundas), con el aviso de no hiperventilar.", "1|Ansiedad y estrés|Rutinas antiestrés": "Coinciden en una rutina diaria que combine meditación, paseo y propósito, y en cuidar cuándo te informas; Campillo añade el contacto con zonas verdes (regla 3-30-300).", "1|Emociones y autoestima|Actitud y resiliencia": "Coinciden en levantarse y perseverar con buena actitud; Marian Rojas matiza el «si quieres, puedes» y el Lama recuerda que aceptar no es rendirse.", "1|Emociones y autoestima|Autoconocimiento": "Coinciden en mirarse con honestidad (espejo, cómo tratas al camarero, dejar de autoengañarse); chocan en cuánto pesan las circunstancias: Marquina y Macías dicen que «nadie nos hace nada» o que es «una historia que te cuentas», algo que otros no suscriben.", "1|Emociones y autoestima|Autocontrol": "Coinciden en el valor de posponer la gratificación, aunque el test del malvavisco que citan predice menos de lo que se creía.", "1|Emociones y autoestima|Autoestima": "Coinciden en una autoestima realista basada en lo que ya haces bien, en tu entorno y en revisar tu infancia, no en frases grandilocuentes ante el espejo; Vizuete añade que un poco de duda ayuda.", "1|Emociones y autoestima|Confianza en uno mismo": "Coinciden en perder el miedo a equivocarse y en imitar a quien lo logra; chocan en el método, pues Villar se apoya en la PNL, sin respaldo científico.", "1|Emociones y autoestima|Gestionar emociones": "Coinciden en expresar lo que sientes y en no tomarte lo ajeno como algo personal; Tijerina confía más en la intuición, que también puede fallar.", "1|Emociones y autoestima|Gratitud": "Todos recomiendan una práctica diaria de gratitud (escrita o repasando el día); chocan en lo que prometen: Marcus y Villar exageran sus efectos (alzhéimer, infarto, sistema linfático).", "1|Emociones y autoestima|Límites": "Coinciden en aprender a poner límites hoy sin quedarse en reproches; Marquina lo basa en su teoría de temperamentos, que no tiene estudios.", "1|Emociones y autoestima|Pedir ayuda y terapia": "Coinciden en pedir ayuda y en acudir a un psicólogo cuando hay trauma, empezando por sentirte validado.", "1|Emociones y autoestima|Qué dirán": "Coinciden en no vivir pendiente de gustar a todos: hacer lo tuyo lo mejor posible y dejar que cada uno juzgue.", "1|Pareja y relaciones|Amistades y entorno": "Coinciden en que las relaciones de calidad son el mayor predictor de felicidad y salud y en ser selectivo y cultivar amigos en persona; solo cambia el énfasis: unos piden alejar a los tóxicos y otros mantener a los de siempre.", "1|Pareja y relaciones|Apego y dependencia": "Mansukhani habla de estrategias de apego, no de tipos fijos, cuyo objetivo es una relación adulta interdependiente, y da señales de dependencia.", "1|Pareja y relaciones|Atracción y citas": "Coinciden en ir despacio, ser claro y observar cómo discute la otra persona; chocan en el sexo casual: Jankowska lo desaconseja y Hurtado lo deja a la armonía con la otra persona, con datos discutidos y alguna idea sin base.", "1|Pareja y relaciones|Compromiso": "Coinciden en hablar pronto y con honestidad de lo importante (hijos, tareas, exclusividad, tu pasado) para construir confianza.", "1|Pareja y relaciones|Discusiones y comunicación": "Coinciden en tratar el conflicto como «nosotros contra el problema», hablar desde lo que sientes, pausar si hay ataque y evitar el desprecio; Mansukhani añade que algo de conflicto es sano.", "1|Pareja y relaciones|Enamoramiento y expectativas": "Coinciden en que la media naranja y el amor de película son mitos y en tener expectativas realistas, porque el enamoramiento se acaba en uno o dos años.", "1|Pareja y relaciones|Encontrar pareja": "Coinciden en buscar pareja desde la plenitud y no desde la necesidad y en saber qué quieres; Macías y Fonseca dan atajos (intuición, grupos religiosos) sin fundamento.", "1|Pareja y relaciones|Intimidad y sexualidad": "Coinciden en que el deseo en pareja estable se construye con intimidad, contacto sin objetivo y comunicación, sin frecuencia «correcta»; las técnicas de Hurtado (retención) y Jankowska (mirarse 5 minutos) no tienen evidencia.", "1|Pareja y relaciones|Perdón e infidelidad": "Coinciden en que perdonar es soltar un peso; chocan en el momento: el Lama propone perdonar por adelantado y Jankowska solo tras ver un cambio real.", "1|Pareja y relaciones|Personas difíciles y trato": "Coinciden en tratar bien a todos pero poner distancia física o emocional y límites concretos a quien te trata mal.", "1|Pareja y relaciones|Relaciones tóxicas y ruptura": "Coinciden en que el sufrimiento constante, perder tus límites o la violencia indican que hay que salir; Hurtado propone separarse antes de llegar a odiarse.", "1|Pareja y relaciones|Relación a largo plazo": "Coinciden en que la pareja larga se trabaja: citas fijas, revisiones periódicas y seguir descubriendo al otro.", "1|Pareja y relaciones|Relación sana y convivencia": "Coinciden en una relación horizontal y de equipo, con respeto y sin control, sostenida en la rutina diaria.", "1|Familia e hijos|Educar hijos": "Coinciden en aceptar cómo es el hijo, potenciar sus fortalezas y lo que os une y relajarse ante la perfección; Macías llega a lo mismo desde la numerología, sin base.", "1|Familia e hijos|Hijos y dinero": "Los tres coinciden en que los hijos se ganen las cosas y en no darles de más.", "1|Familia e hijos|Tener hijos y nido vacío": "Mansukhani avisa de no volcar la pareja en los hijos y Jankowska sostiene que no tenerlos aumenta la soledad en la vejez, un dato con evidencia mixta.", "1|Duelo y sentido|Crisis y cambios": "Coinciden en ver las crisis y los grandes cambios (un viaje largo, perder lo construido) como oportunidad para replantearse la vida.", "1|Duelo y sentido|Dinero y felicidad": "Coinciden en que el dinero ayuda hasta cierto punto pero trae problemas y en que el lujo debe ser excepcional; las cifras de Gutiérrez sobre la caída de la felicidad no las confirman los estudios recientes.", "1|Duelo y sentido|Duelo, rupturas y muerte": "Coinciden en que el duelo no es lineal y lleva tiempo y en que conviene reelaborar los recuerdos en vez de forzarte a olvidar.", "1|Duelo y sentido|Estoicismo y desapego": "Coinciden en necesitar menos, desapegarse del estatus y aceptar el cambio sin vivir con miedo.", "1|Duelo y sentido|Felicidad y sentido": "Coinciden en priorizar experiencias, personas y ayudar a otros sobre acumular, y en estar a gusto con lo que tienes sin dejar de aspirar a más.", "1|Duelo y sentido|Propósito": "Coinciden en que tener un propósito y contribuir a otros da sentido; chocan en cómo encontrarlo: Dieck pide buscar significado más que felicidad y Marquina iguala propósito a lo que te hace feliz.", "1|Adicciones y pantallas|Dejar una adicción": "Luis Miguel Real insiste en controlar el entorno y los estímulos, apuntar tus razones y buscar nuevos reforzadores, todo coherente con la terapia de adicciones.", "1|Adicciones y pantallas|Móvil y videojuegos": "Coinciden en entender qué función cumple la pantalla y en hacerla difícil o eliminarla en vez de prohibírtela a fuerza de voluntad.", "1|Hábitos y productividad|Cambiar hábitos": "Coinciden en empezar con cambios pequeños, constantes y agradables (juntar lo que debes con lo que te gusta) y en que no hay atajos mágicos.", "1|Hábitos y productividad|Compromiso con otros": "Coinciden en que comprometerte con otra persona (un amigo, una hora fija) te ayuda a cumplir.", "1|Hábitos y productividad|Concentración": "Coinciden en bloques de concentración con descansos, un ritual de entrada y retos difíciles pero alcanzables; el truco de mirar un objeto sin parpadear no tiene evidencia.", "1|Hábitos y productividad|Decidir con calma": "Coinciden en no decidir en caliente: dejar pasar 15 minutos o un día, porque la emoción decide y la razón justifica.", "1|Hábitos y productividad|Disciplina": "Coinciden en que la disciplina pesa más que la motivación y en hacer los hábitos innegociables; Murillo añade que se es disciplinado en lo que gusta, y Hernández Jarque avisa de que la pasión convertida en trabajo se quema.", "1|Hábitos y productividad|Diseño del entorno": "Coinciden en que cambiar el entorno (orden, objetos a mano, gente que ya lo hace) facilita el hábito más que la fuerza de voluntad.", "1|Hábitos y productividad|Equilibrio vida-trabajo": "Coinciden en reservar tiempo fijo para relaciones, ejercicio y descanso y en no dejar que el trabajo se lo coma todo.", "1|Hábitos y productividad|Gestión del tiempo": "Hernández Jarque propone auditar tu tiempo, bloquear las prioridades en el calendario y trabajar en bloques de unos 90 minutos.", "1|Hábitos y productividad|Libretas y registro": "Coinciden en registrar hábitos, ideas y tareas en una libreta de papel mejor que en el móvil.", "1|Hábitos y productividad|Mejora continua": "Coinciden en la filosofía kaizen: mejorar un poco cada vez («un 1 %»).", "1|Hábitos y productividad|Motivación": "Coinciden en buscar un motivo con significado y disfrutar del proceso, usando incentivos visibles (medidas, pequeñas victorias).", "1|Hábitos y productividad|Objetivos": "Coinciden en escribir pocos objetivos con un porqué fuerte y traducirlos en hábitos y tareas concretas; Macías y Millán añaden visualización y eclipses, sin evidencia.", "1|Hábitos y productividad|Objetivos: método de las tres hojas": "Método de Hernández Jarque: una vez al año, áreas, objetivos SMART y tareas en papel, siempre a la vista.", "1|Hábitos y productividad|Planificación y revisión": "Coinciden en revisar con regularidad (cada semana el domingo o cada 6 meses) y preparar la semana por adelantado.", "1|Hábitos y productividad|Procrastinación": "Coinciden en que la procrastinación es emocional y funciona como un hábito, y en que se vence reduciendo la fricción y empezando con un mínimo de 5-10 minutos.", "1|Hábitos y productividad|Productividad": "Coinciden en simplificar y no sobreorganizar: productividad es resultado entre coste, sin llenar cada hueco.", "1|Hábitos y productividad|Rutina de mañana": "Coinciden en una mañana ordenada (luz natural, sin noticias, ejercicio, tareas ligeras); chocan en madrugar: Villar lo presenta como válido para todos, sin tener en cuenta los cronotipos.", "1|Hábitos y productividad|Rutinas diarias": "Coinciden en dormir bien y aprovechar tu mejor franja horaria; Jankowska lo extiende al ciclo menstrual, con evidencia débil.", "1|Hábitos y productividad|Sueño y descanso": "Coinciden en proteger el sueño con horarios regulares, luz de mañana y poca luz y pantallas de noche, y en permitirse descansar; Hernández Jarque desprecia el descanso pasivo, en contra de los demás.", "1|Aprender e idiomas|Aprender toda la vida": "Coinciden en formarse y reciclarse siempre, incluidos oficios manuales y herramientas digitales.", "1|Aprender e idiomas|Estudios y carrera": "Los tres relativizan la carrera universitaria frente a la experiencia práctica, una postura que ignora que el título protege del paro.", "1|Aprender e idiomas|Inglés: escuchar y hablar": "Coinciden en escuchar mucho inglés real (series, pódcast, subtítulos en inglés), imitarlo en voz alta y usar el inglés cotidiano, no el de libro.", "1|Aprender e idiomas|Inglés: método": "Coinciden en aprender como un niño, centrándote en entender y hablar antes que en la gramática; chocan en cuándo conversar: Charly's Way pide una fase sin hablar ni leer, y Poberano, hablar desde el principio con profesor.", "1|Aprender e idiomas|Inglés: pronunciación y acentos": "Charly's Way enseña los sonidos clave (flap T, stop T, R muda, dos «u», uniones de palabras) y propone alternar acentos sin quedarse en el RP.", "1|Aprender e idiomas|Inglés: retos y planes intensivos": "Poberano propone planes de 21-30 días: pensar en inglés, grabarse, inmersión total y centrarse en lo que necesitas decir.", "1|Aprender e idiomas|Lectura": "Coinciden en leer libros completos, también novelas o audiolibros, como base del juicio propio.", "1|Aprender e idiomas|Memoria y estudio activo": "Coinciden en que se aprende más con estudio activo, emoción y experiencia, y en que el sueño consolida lo aprendido; lo multisensorial y los sudokus tienen menos respaldo.", "1|Aprender e idiomas|Motivación para aprender": "Poberano insiste en tener un porqué concreto y en no esconder el miedo tras excusas.", "1|Aprender e idiomas|Organizar el estudio": "Coinciden en repartir el estudio con antelación, practicar con exámenes y no darse la panzada; Poberano se contradice sobre repasar antes de dormir.", "1|Aprender e idiomas|Pensamiento crítico": "Coinciden en contrastar fuentes, escuchar al que piensa distinto, dudar de tus certezas y no delegar todo el pensamiento en la IA.", "1|Aprender e idiomas|Tomar notas": "Coinciden en tomar notas a mano y con estructura (mapas mentales, libretas), aunque la ventaja de escribir a mano tiene evidencia mixta.", "1|Comunicar y oratoria|Carisma y empatía": "Tijerina basa el carisma en combinar calidez y competencia y la empatía más útil en la compasiva.", "1|Comunicar y oratoria|Comunicación no verbal": "Coinciden en que el cuerpo comunica mucho pero no es un diccionario: hay que leer el contexto y varios indicios a la vez; Vizuete desmonta el mito del 93 % de Mehrabian.", "1|Comunicar y oratoria|Conversaciones difíciles y límites": "Coinciden en preparar la conversación, no hiperreaccionar, apoyarte en hechos y decir lo que sientes, siendo sincero sin ser hiriente.", "1|Comunicar y oratoria|Conversación y escucha": "Coinciden en que el buen conversador escucha y pregunta con interés y no habla de sí mismo.", "1|Comunicar y oratoria|Explicar con sencillez": "Coinciden en explicar con metáforas y lenguaje sencillo, como a un niño, sin perder rigor.", "1|Comunicar y oratoria|Hablar en público": "Coinciden en preparar y visualizar la charla, hablar de lo cotidiano y alinear voz, cuerpo y mensaje con emoción.", "1|Comunicar y oratoria|Imagen y vestimenta": "Coinciden en vestir según el contexto, un punto por encima, sin ostentación.", "1|Comunicar y oratoria|Liderazgo y equipos": "Coinciden en que el líder escucha, da ejemplo y adapta su estilo y el trato a cada persona y situación.", "1|Comunicar y oratoria|Mirada": "Vizuete aconseja una mirada que alterne y descanse; su afirmación de que está «demostrado» que la mirada capta atención no cita estudio.", "1|Comunicar y oratoria|Naturalidad y credibilidad": "Coinciden en que fingir se nota: mejora dentro de tu estilo natural y sé coherente entre lo que dices y haces.", "1|Comunicar y oratoria|Pedir perdón": "Vizuete defiende disculpas completas (qué, por qué, compromiso de cambio) y agradecer más que excusarse cuando llegas tarde.", "1|Comunicar y oratoria|Persuasión y manipulación": "Coinciden en persuadir con credibilidad, razones y conocimiento del otro y en buscar acuerdos en los que ganen ambos, y dan criterios para detectar la manipulación (adulación, «¿me gustaría que me lo hicieran?»).", "1|Comunicar y oratoria|Seguridad y miedo escénico": "Coinciden en que la seguridad empieza en la mente y se apoya en respirar con el diafragma; el «fake it till you make it» tiene poco respaldo.", "1|Comunicar y oratoria|Voz": "Tijerina recomienda cuidar la voz, por su efecto halo, y terminar las frases con tono firme.", "1|Emociones y autoestima|Autoexigencia": "Real y Mora coinciden en tratarse con menos dureza: Real pide poner por escrito los pensamientos autoexigentes para cuestionarlos y cambiar la culpa por el disfrute, y Mora propone hablarse con el cariño con que se hablaría al niño de una foto; no chocan entre sí.", "1|Emociones y autoestima|Trauma": "Mansukhani parte siempre del presente: un recuerdo deja de ser trauma cuando ya no condiciona el hoy, y para trabajarlo propone tirar del hilo de una sensación actual en vez de escarbar en todo el pasado; no hay otras voces que lo contradigan.", "5|Preparación y emergencias|Plan y simulacros": "Presa insiste en que el plan pesa más que el material: puntos A, B y C con un punto de encuentro familiar y simulacros cronometrados para ganar tiempo; no hay otros expertos que lo contradigan.", "5|Preparación y emergencias|Kit de oficina y coche": "Presa recomienda tener material repartido fuera de casa (una bolsa en la oficina, un kit en el coche y lo que llevas a diario), porque la emergencia puede pillarte lejos; nadie lo contradice.", "1|Comunicar y oratoria|Entrevistar": "Solo Rossini trata el tema: propone entrevistar y no interrogar, con conexión, interés genuino, calma y repreguntas «a lo Columbo»; ningún otro experto lo contradice.", "0|Nutrición|Agua e hidratación": "Coinciden en beber agua y no bebidas azucaradas ni zumos; Ochoa añade una pizca de sal y limón, y lo de agua «hablada», hidrógeno o filtros contra el plomo de Marcus no tiene respaldo.", "0|Nutrición|Almidón resistente": "Campillo y Marcus coinciden en cocinar, enfriar y recalentar arroz, patata o legumbres para formar almidón resistente; Campillo exagera el porcentaje y ambos piden refrigerar bien el arroz.", "0|Nutrición|Ayuno": "Díaz Rizzolo dice que el ayuno intermitente no adelgaza más que comer menos y Ochoa avisa de su riesgo con medicación para diabetes; Segarra defiende 12 h de ayuno nocturno, y lo de la autofagia o el ayuno de 24 h de Macías no está probado.", "0|Nutrición|Azúcar y bebidas azucaradas": "Coinciden en reducir el azúcar libre y sobre todo el bebido (un refresco ya pasa el máximo de la OMS) y en leer los nombres camuflados; Díaz Rizzolo lo admite de postre tras una comida completa.", "0|Nutrición|Café y cafeína": "Ochoa y Campillo lo ven saludable por sus polifenoles; Liu y Campillo avisan de la dependencia, Nate y Liu de su efecto en el sueño y la tensión, y todos rechazan las bebidas energéticas.", "0|Nutrición|Carne y embutidos": "Coinciden en reducir carne grasa y procesada y cambiarla por legumbres, soja y pescado sin llegar a ser 100 % vegetal; Marcus salva el pavo y el jamón de Jabugo, aunque se equivoca al decir que el jamón no tiene colesterol.", "0|Nutrición|Comer fuera y caprichos": "Coinciden en que no hacen falta prohibiciones absolutas: caprichos puntuales o el fin de semana, con trucos como comer antes ensalada o quitar parte del pan.", "0|Nutrición|Desayuno": "Coinciden en un desayuno con proteína y sin dónut ni zumo; Ochoa y Murillo lo prefieren salado (huevos, carne), Bartolomé incluye avena o yogur y avisa de que una tostada «sana» puede llegar a 700 kcal.", "0|Nutrición|Dieta cetogénica y low carb": "Díaz Rizzolo la define (menos de 50 g de hidratos) y advierte del LDL, aunque exagera al decir que siempre sube.", "0|Nutrición|Dieta mediterránea y antiinflamatoria": "Coinciden en la mediterránea con verduras, legumbres, pescado, aceite de oliva y especias; Campillo dice que cualquier dieta bien hecha vale igual y las algas «desintoxicantes» de Marcus no tienen respaldo.", "0|Nutrición|Digestión y estreñimiento": "Coinciden en fibra, agua y movimiento; Campillo añade algo de sal y, en casos rebeldes, quitar la fibra uno o dos días, una pauta para hacer con el médico.", "0|Nutrición|Etiquetas y ultraprocesados": "Coinciden en basar la dieta en comida sin etiqueta y desconfiar de los reclamos «light», «integral» o «0 %»; Díaz Rizzolo distingue procesado sano de ultraprocesado y Segarra propone no comprar productos con más de tres ingredientes.", "0|Nutrición|Frutos secos y semillas": "Díaz Rizzolo pide añadir más semillas a los platos y Bartolomé prefiere masticar el fruto seco a las cremas, que reserva para quien no llega a las calorías.", "0|Nutrición|Gluten": "Bartolomé dice que solo deben quitar el gluten los celiacos (1 %) y los sensibles, ni siquiera la mayoría con Hashimoto; Ochoa propone quitarlo a todos como prueba, algo que no tiene respaldo.", "0|Nutrición|Hidratos y harinas": "Coinciden en bajar las harinas blancas y el azúcar y elegir integrales, tubérculos y legumbres; Ochoa va más lejos (hidratos solo de vegetales, sin fruta) y Bartolomé los mantiene ajustados a la actividad.", "0|Nutrición|Horario de comidas": "Díaz Rizzolo pide concentrar la comida en unas 10 horas y en la parte temprana del día; Bartolomé lo adapta al horario de trabajo y Liu pide no comer tras la puesta de sol, sin evidencia.", "0|Nutrición|Intolerancias y alergias": "Díaz Rizzolo dice que los test IgG son tirar el dinero, pero Segarra los sugiere como orientación; ambos prefieren la dieta de eliminación y reintroducción guiada.", "0|Nutrición|Lácteos": "Ochoa prefiere la leche entera a la desnatada y a las vegetales azucaradas, pero también propone retirarla un tiempo, algo sin motivo si no hay intolerancia.", "0|Nutrición|Nutrición deportiva": "Coinciden en tomar hidratos o geles durante esfuerzos largos (más de 60 km o 5 h de bici) para evitar la pájara; para el día a día siguen pidiendo poco azúcar.", "0|Nutrición|Orden de los alimentos": "Coinciden en comer primero verdura y fibra, luego proteína y al final los hidratos para aplanar el pico; Ochoa avisa de que no hace sano el postre y Campillo propone acabar con el capricho, sin estudio que lo respalde.", "0|Nutrición|Pescado": "Coinciden en el pescado azul pequeño (menos mercurio) y Bartolomé avisa de que empanado, frito o en barritas pierde su beneficio.", "0|Nutrición|Picos de glucosa": "Coinciden en que los hidratos solos y los líquidos suben más la glucosa y que acompañarlos de proteína, grasa y fibra los aplana; Díaz Rizzolo pide no obsesionarse y Ochoa fija un tope propio de 30 mg/dl sin respaldo clínico.", "0|Nutrición|Picoteo y snacks": "Coinciden en picar proteína o verdura (huevo cocido, yogur, frutos secos, zanahoria con hummus) y en saciarse con agua y fibra; Tubau propone no tener tentaciones en casa.", "0|Nutrición|Plantas, fibra y microbiota": "Díaz Rizzolo pide unos 20-30 tipos de plantas a la semana y avisa de unos días de molestias al subir la variedad.", "0|Nutrición|Plato saludable": "Coinciden en un plato con mitad de verdura, proteína y algo de hidrato integral (plato de Harvard) y en empezar por la proteína; Ochoa sube la verdura y la grasa a costa del hidrato.", "0|Nutrición|Proteína": "Coinciden en asegurar proteína de calidad, animal o vegetal; Bartolomé da la cifra (1,2-1,5 g/kg de peso ajustado al perder grasa) y la proteína en polvo como apoyo, y Ochoa propone vísceras baratas.", "0|Nutrición|Pérdida de peso y calorías": "Coinciden en que manda el déficit calórico, que el cuerpo se resiste y que castigarse o prohibir todo provoca rebote; Campillo matiza que las calorías son aproximadas y añade un modelo de seis ejes sin estudio.", "0|Nutrición|Reeducar el paladar": "Coinciden en bajar el dulzor poco a poco y no de golpe; Ochoa admite el edulcorante como puente y Nate propone fruta y comida sana que guste.", "0|Nutrición|Sal": "Campillo explica el daño del exceso de sal y dice que casi toda viene de ultraprocesados, así que un poco al cocinar no preocupa.", "0|Nutrición|Vinagre de manzana": "Díaz Rizzolo y Ochoa coinciden en que un poco de vinagre diluido antes de comer baja el pico de glucosa; el efecto es modesto y daña el esmalte.", "0|Ejercicio y fuerza|Caminar tras comer": "Díaz Rizzolo y Segarra coinciden en caminar 15-20 minutos después de comer para bajar el pico de glucosa.", "0|Ejercicio y fuerza|Cardio, HIIT y zona 2": "Coinciden en combinar fuerza con aeróbico; Marcus y Murillo apuestan por intervalos (HIIT, Tabata) para el VO2 máx y la zona 2 para la base, y Campillo vale con escaleras y sprints cortos.", "0|Ejercicio y fuerza|Constancia y motivación": "Coinciden en empezar poco (1-3 sesiones o un minuto al día), elegir algo que guste y reducir la fricción; Real y Yago avisan de que lo radical se abandona y lo de los «28 días para un hábito» es un mito.", "0|Ejercicio y fuerza|Cuánto ejercicio": "Mora cita los 150-300 minutos semanales de la OMS y prefiere moverse un poco cada día a hacer mucho de vez en cuando.", "0|Ejercicio y fuerza|Dolor, huesos y articulaciones": "Yago defiende la fuerza para el dolor crónico, los tendones y el hueso, con cautela si hay osteoporosis.", "0|Ejercicio y fuerza|Empezar a correr": "Coinciden en empezar alternando caminar y correr e ir subiendo poco a poco; Segarra pide antes una semana caminando, una revisión cardiológica y nada de media maratón en dos años.", "0|Ejercicio y fuerza|Entrenador personal": "Patricio Ochoa y Nate coinciden en que pagar un entrenador ayuda a ser constante y quita decisiones, si se lo puede uno permitir.", "0|Ejercicio y fuerza|Fuerza": "Coinciden en entrenar fuerza unas 3 veces por semana con sobrecarga progresiva para la salud metabólica y ósea; Presa es la excepción y prefiere la forma física funcional al gimnasio.", "0|Ejercicio y fuerza|Hipertrofia: brazos": "Yago propone extensión en polea tras nuca para tríceps y curl predicador, a 45° y martillo para bíceps; el antebrazo no hace falta trabajarlo aparte.", "0|Ejercicio y fuerza|Hipertrofia: glúteo y piernas": "Yago dice que hip thrust y sentadilla rinden parecido para el glúteo: hip thrust si priorizas glúteo y sentadilla si vas justo de tiempo; para gemelos, series de 8-20 cerca del fallo.", "0|Ejercicio y fuerza|Hipertrofia: pecho": "Yago propone ejercicios analíticos para el pectoral: press inclinado guiado, cruces de poleas y máquina convergente.", "0|Ejercicio y fuerza|Medir el progreso": "Yago pide medir perímetros, peso y entrenos siempre en las mismas condiciones para ver la evolución real.", "0|Ejercicio y fuerza|Movilidad y sedentarismo": "Liu avisa de que pasar horas sentado acorta músculos y Marcus pide trabajar movilidad, equilibrio y core con la edad.", "0|Ejercicio y fuerza|Pasos y NEAT": "Coinciden en que el movimiento diario fuera del gimnasio (NEAT) suma mucho y en usar trucos como escaleras, aparcar lejos o bajarse antes; Yago y Segarra rechazan los 10.000 pasos como cifra fija y prefieren partir de la media propia.", "0|Ejercicio y fuerza|Snacks idad": "Díaz Rizzolo y Campillo coinciden en que la vida social es de lo que más alarga la vida; la medición de telómeros de Marcus aporta poco.", "0|Cuerpo y longevidad|Medicina tradicional china": "Liu reconoce que la acupuntura solo alivia el dolor; sus remedios (aloe, golpear los dientes, peine de madera, la piel que «elimina toxinas») no tienen evidencia.", "0|Cuerpo y longevidad|Microbiota": "Campillo explica cómo la microbiota regula el tránsito, la saciedad y la inflamación; el «vaginal seeding» de Díaz Rizzolo no lo recomiendan los obstetras.", "0|Cuerpo y longevidad|Reglas de hábitos": "Coinciden en que los hábitos funcionan juntos y no aislados; Marcus pide no perseguir todas las modas y Campillo resume todo en su regla 5-4-3-2-1-0.", "0|Cuerpo y longevidad|Respiración y nervio vago": "Campillo y Marcus proponen seguir la HRV con pulsera o anillo y subirla con respiración lenta, canto, risa y frío.", "0|Cuerpo y longevidad|Suelo pélvico": "Hurtado desaconseja los Kegel y propone su propio ejercicio de respiración y periné; esto contradice la indicación médica de los Kegel en incontinencia.", "0|Cuerpo y longevidad|Vista": "Millán recuerda que no hay que mirar el Sol en un eclipse parcial sin gafas homologadas; lo de que el verde «nutre» la vista de Liu no tiene base.", "0|Primeros auxilios|Agua y supervivencia": "Presa prioriza tener agua sobre la comida, filtrarla y potabilizarla, y desmiente que se pueda beber la orina.", "0|Primeros auxilios|Botiquín y manta térmica": "Presa recomienda un botiquín IFAK con formación y un bolsillo de higiene; la manta térmica, con la cara plateada hacia el cuerpo según Cruz Roja.", "0|Primeros auxilios|Torniquete y hemorragias": "Presa explica que el torniquete va alto y apretado, solo en brazos y piernas, con la hora anotada y sin aflojarlo; donde no se puede poner, gasa hemostática y presión.", "4|Uso de la IA|Elegir herramienta": "Jon Hernández dice que cualquier IA grande sirve: elige la que encaje con tu ecosistema
