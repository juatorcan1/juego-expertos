<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>El juego de los expertos · Tengo un Plan</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#fbf7ef;--card:#fff;--ink:#22252a;--muted:#6d7178;--line:#e8e1d2;--acc:#2f5d50;--ok:#2e7d4f;--okbg:#e4f4e9;--bad:#c2372d;--badbg:#fde9e7;--gold:#d49b1f;--c0:#3f9d6b;--c1:#7b61c9;--c2:#d39a1d;--c3:#e0613a;--c4:#2f86c9;--c5:#5a6b7a}
@media (prefers-color-scheme:dark){:root{--bg:#15171a;--card:#1f2227;--ink:#ece9e3;--muted:#9da3ab;--line:#30343b;--acc:#7fc1ab;--okbg:#1c3426;--badbg:#3b1e1c}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,sans-serif}
h1,h2,h3,.fred{font-family:Fredoka,Inter,sans-serif}
.top{position:sticky;top:0;z-index:9;background:var(--bg);border-bottom:1px solid var(--line)}
.top .in{max-width:900px;margin:0 auto;padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.logo{font:700 20px Fredoka;cursor:pointer;flex:1}
.st{font-size:14px;color:var(--muted)}.st b{color:var(--ink)}
.wrap{max-width:900px;margin:0 auto;padding:16px 16px 80px}
.btn{border:0;background:var(--acc);color:#fff;border-radius:12px;padding:12px 18px;font:600 16px Fredoka;cursor:pointer;transition:transform .1s}
.btn:active{transform:scale(.97)}.btn.sec{background:var(--card);color:var(--ink);border:1.5px solid var(--line)}.btn:disabled{opacity:.4;cursor:default}
.modos{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin:14px 0}
.modo{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:16px;cursor:pointer;transition:transform .15s,box-shadow .15s}
.modo:hover{transform:translateY(-3px);box-shadow:0 8px 20px #0000000f}.modo .e{font-size:34px}.modo h3{margin:4px 0}.modo p{margin:0;color:var(--muted);font-size:14px}
.hero{background:linear-gradient(135deg,#2f5d50,#3f9d6b);color:#fff;border-radius:22px;padding:22px;display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.hero h1{margin:0 0 4px;font-size:28px}.hero p{margin:0 0 12px;opacity:.9}
.sobre{width:120px;height:160px;border-radius:14px;background:repeating-linear-gradient(45deg,#d49b1f,#d49b1f 12px,#e7b74a 12px,#e7b74a 24px);display:grid;place-items:center;font:700 22px Fredoka;color:#fff;box-shadow:0 10px 24px #0003;cursor:pointer;transition:transform .2s}
.sobre:hover{transform:rotate(-4deg) scale(1.05)}.sobre.shake{animation:shake .6s}
@keyframes shake{0%,100%{transform:rotate(0)}20%{transform:rotate(-8deg)}40%{transform:rotate(8deg)}60%{transform:rotate(-6deg)}80%{transform:rotate(6deg)}}
.cromo{border-radius:16px;padding:14px;color:#fff;position:relative;min-height:150px;box-shadow:0 6px 16px #0002}
.cromo .n{font:700 19px Fredoka;line-height:1.15}.cromo .p{opacity:.9;font-size:13px;margin-top:2px}
.cromo .r{position:absolute;top:10px;right:12px;font-size:12px;background:#ffffff33;border-radius:99px;padding:2px 8px}
.cromo .k{position:absolute;bottom:10px;left:14px;font-size:13px;opacity:.95}
.leg{background:linear-gradient(135deg,#b8860b,#f3c84b,#b8860b)!important;color:#3a2a00}.leg .r{background:#0002}
.flip{animation:flip .7s ease}@keyframes flip{from{transform:rotateY(90deg) scale(.6);opacity:0}to{transform:none;opacity:1}}
.album{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.hueco{border:2px dashed var(--line);border-radius:16px;min-height:150px;display:grid;place-items:center;color:var(--muted);font:600 26px Fredoka}
.tip{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:8px 0}
.f{font-weight:700;margin-right:6px}.f.ok{color:var(--ok)}.f.opi{color:#5b6b8c}.f.w{color:var(--gold)}
.ojo{display:block;margin-top:5px;background:#fff4e0;color:#8a5a00;border-radius:8px;padding:3px 8px;font-size:14px}
a.m{font-size:13px;color:var(--muted);text-decoration:none;margin-left:6px}
.back{background:none;border:0;color:var(--acc);font:600 15px Inter;cursor:pointer;padding:0;margin:4px 0 8px}
.ruleta{width:280px;height:280px;border-radius:50%;margin:10px auto;position:relative;transition:transform 3.2s cubic-bezier(.17,.67,.2,1);border:6px solid var(--card);box-shadow:0 8px 24px #0002}
.flecha{width:0;height:0;border-left:16px solid transparent;border-right:16px solid transparent;border-top:28px solid var(--ink);margin:0 auto -18px;position:relative;z-index:2}
.rl{position:absolute;left:50%;top:50%;transform-origin:0 0;font:600 13px Fredoka;color:#fff;white-space:nowrap}
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media (max-width:600px){.mem{grid-template-columns:repeat(3,1fr)}}
.mc{aspect-ratio:3/4;border-radius:12px;cursor:pointer;perspective:600px}
.mc .in2{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.mc.up .in2,.mc.ok .in2{transform:rotateY(180deg)}
.mc .fa,.mc .fb{position:absolute;inset:0;border-radius:12px;backface-visibility:hidden;display:grid;place-items:center;padding:8px;text-align:center}
.mc .fa{background:repeating-linear-gradient(45deg,#2f5d50,#2f5d50 10px,#3a6e60 10px,#3a6e60 20px);color:#fff;font:700 28px Fredoka}
.mc .fb{transform:rotateY(180deg);background:var(--card);border:1.5px solid var(--line);font-size:12.5px;line-height:1.3}
.mc .fb.ex{font:600 14px Fredoka}.mc.ok .fb{border-color:var(--ok);background:var(--okbg)}
.arc{background:var(--card);border:1.5px solid var(--line);border-radius:20px;padding:20px;text-align:center}
.arc .frase{font-size:19px;margin:16px 0;min-height:110px}.arc .quien{color:var(--muted);font-size:14px}
.hud{display:flex;justify-content:space-between;font:600 17px Fredoka}
.timer{height:8px;background:var(--line);border-radius:9px;overflow:hidden;margin:10px 0}.timer i{display:block;height:100%;background:var(--gold);transition:width .25s linear}
.flash-ok{animation:fo .5s}.flash-bad{animation:fb .5s}@keyframes fo{0%{background:var(--okbg)}}@keyframes fb{0%{background:var(--badbg)}}
.combo{color:var(--gold);font:700 22px Fredoka;min-height:28px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font:600 15px Fredoka;z-index:20;animation:up .3s}
@keyframes up{from{transform:translate(-50%,20px);opacity:0}}
.conf{position:fixed;top:-10px;width:10px;height:14px;z-index:30;animation:caer 1.8s linear forwards}@keyframes caer{to{transform:translateY(105vh) rotate(540deg)}}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.chip{border:1.5px solid var(--line);background:var(--card);border-radius:99px;padding:6px 12px;cursor:pointer;font:500 14px Inter;color:var(--ink)}.chip.on{border-color:var(--acc);background:var(--acc);color:#fff}
.aviso{font-size:13px;color:var(--muted);margin-top:22px}
</style>
</head>

<script>
const D=[[0, "Analíticas y prevención", "Analítica básica", "✔", "Dr. Víctor Beguería (médico)", "Dice que el HDL y los triglicéridos reflejan sobre todo tu salud metabólica (sensibilidad a la insulina, poca grasa, ejercicio), no tanto el riesgo de formar placa de ateroma.", "", "11:51", "https://www.youtube.com/watch?v=7EkNyDLe_Js&t=711s"], [0, "Analíticas y prevención", "Colesterol y ApoB", "●", "Dr. Víctor Beguería (médico)", "Dice que muchos rangos de colesterol se alcanzan cambiando la alimentación; el problema es querer el colesterol bajo sin cambiar la dieta.", "", "14:16", "https://www.youtube.com/watch?v=7EkNyDLe_Js&t=856s"], [0, "Analíticas y prevención", "Colesterol y ApoB", "✔", "Dr. Víctor Beguería (médico)", "Dice que la ApoB predice mejor el riesgo que el LDL porque cuenta partículas: dos personas con el mismo LDL pueden tener distinto número; no sustituye al LDL, se complementan, y hay gente con LDL «normal» y ApoB alta.", "", "15:47", "https://www.youtube.com/watch?v=7EkNyDLe_Js&t=947s"], [0, "Analíticas y prevención", "Lipoproteína (a)", "✔", "Dr. Víctor Beguería (médico)", "Dice que, partícula a partícula, la lipoproteína (a) es «más kamikaze» que el LDL: cuanto más alta, más riesgo cardiovascular.", "", "17:09", "https://www.youtube.com/watch?v=7EkNyDLe_Js&t=1029s"], [0, "Nutrición", "Carne y embutidos", "✔", "Dr. Víctor Beguería (médico)", "Dice que todas las carnes tienen grasa saturada (pollo y pavo algo menos, pero no son «buenas» frente a nueces o tofu) y que hay aún más en embutidos (jamón, lomo, chorizo), quesos, lácteos enteros (leche, yogur griego) y bollería industrial.", "", "32:18", "https://www.youtube.com/watch?v=7EkNyDLe_Js&t=1938s"], [0, "Hormonas", "Testosterona", "✔", "Dr. Víctor Beguería (médico)", "Dice que un déficit calórico muy agresivo y el exceso de grasa bajan la testosterona; si ya tienes buena composición corporal, buena nutrición y haces fuerza, poco más vas a subirla: céntrate en evitar los «ladrones de testosterona».", "", "36:37", "https://www.youtube.com/watch?v=7EkNyDLe_Js&t=2197s"], [0, "Analíticas y prevención", "Composición corporal", "✔", "Dra. Laura Bartolomé (endocrina)", "Dice que el IMC (peso/talla²) es mal indicador: puedes tener un IMC normal (hasta 25) con mucha grasa, hígado graso y poco músculo, o un 27 de deportista musculado y estar «sanísimo».", "", "02:58", "https://www.youtube.com/watch?v=eZyrkbxSsSo&t=178s"], [0, "Analíticas y prevención", "Cintura y grasa visceral", "✔", "Dra. Laura Bartolomé (endocrina)", "Dice que algo de grasa en caderas y glúteos de la mujer es saludable; la que preocupa es la abdominal, la que rodea órganos y corazón y la que se mete en músculo, páncreas o hígado, porque inflama.", "", "04:25", "https://www.youtube.com/watch?v=eZyrkbxSsSo&t=265s"], [0, "Nutrición", "Pérdida de peso y calorías", "✔", "Dra. Laura Bartolomé (endocrina)", "Dice que las calorías sí importan: si comes más de lo que gastas, el cuerpo lo guarda en grasa «como un banco», y cada persona gasta distinto.", "", "12:27", "https://www.youtube.com/watch?v=eZyrkbxSsSo&t=747s"], [0, "Analíticas y prevención", "Composición corporal", "✔", "Dra. Laura Bartolomé (endocrina)", "Dice que tener algo de grasa es necesario (hormonas, fertilidad): la mortalidad sigue una curva en U, más alta con muy poca grasa y con exceso.", "", "16:28", "https://www.youtube.com/watch?v=eZyrkbxSsSo&t=988s"], [0, "Nutrición", "Digestión y estreñimiento", "✔", "Dra. Laura Bartolomé (endocrina)", "Dice que no confundas hinchazón con inflamación: sentirte «como un globo» tras comer depende de digestión, gases y microbiota; la inflamación crónica es otra cosa (activación del sistema inmune).", "", "17:52", "https://www.youtube.com/watch?v=eZyrkbxSsSo&t=1072s"], [0, "Nutrición", "Pérdida de peso y calorías", "●", "Dra. Laura Bartolomé (endocrina)", "Dice que al adelgazar el adipocito solo se encoge («es muy difícil matar un adipocito»), que tras bajar un ~5 % el cuerpo defiende su peso (baja el gasto, sube el hambre, baja la saciedad y las hormonas sexuales) y que quien ya tuvo sobrepeso recupera con más facilidad.", "", "18:36", "https://www.youtube.com/watch?v=eZyrkbxSsSo&t=1116s"], [0, "Nutrición", "Pérdida de peso y calorías", "●", "Dra. Laura Bartolomé (endocrina)", "Dice que «comer menos y andar más» simplifica demasiado: pesan la genética, la menopausia (unos 6 kg de media), el Cushing, el tiroides (menos de lo que se cree) y fármacos que engordan como corticoides, antipsicóticos y antidepresivos.", "", "28:06", "https://www.youtube.com/watch?v=eZyrkbxSsSo&t=1686s"], [0, "Suplementos y fármacos", "GLP-1 (Ozempic, Mounjaro)", "●", "Dra. Laura Bartolomé (endocrina)", "Dice que, bien indicados, estos fármacos mejoran además las enfermedades asociadas a la obesidad: apnea del sueño, artrosis, hipertensión y diabetes; en diabéticos ayudan también a bajar algo la tensión y los triglicéridos.", "", "32:48", "https://www.youtube.com/watch?v=eZyrkbxSsSo&t=1968s"], [0, "Suplementos y fármacos", "GLP-1 (Ozempic, Mounjaro)", "●", "Dra. Laura Bartolomé (endocrina)", "Dice que imitan hormonas que el cuerpo produce al comer (GLP-1 y GIP) y actúan en el cerebro: «disminuyen el ruido de la comida», quitan el apetito emocional y mantienen el fisiológico.", "", "37:30", "https://www.youtube.com/watch?v=eZyrkbxSsSo&t=2250s"], [0, "Analíticas y prevención", "Glucosa y diabetes", "✔", "Dra. Laura Bartolomé (endocrina)", "Dice que, aunque haya predisposición (genes, edad, sexo), evitar la grasa visceral retrasa o evita la diabetes tipo 2.", "", "41:55", "https://www.youtube.com/watch?v=eZyrkbxSsSo&t=2515s"], [0, "Suplementos y fármacos", "GLP-1 (Ozempic, Mounjaro)", "●", "Dra. Laura Bartolomé (endocrina)", "Dice que no siempre son para toda la vida (en obesidad grave sí, a muy largo plazo): al dejarlos se recupera peso poco a poco, sobre todo con genética, menopausia o corticoides, y a veces se hacen descansos o se espacian las dosis.", "", "46:04", "https://www.youtube.com/watch?v=eZyrkbxSsSo&t=2764s"], [0, "Nutrición", "Pérdida de peso y calorías", "✔", "Dra. Laura Bartolomé (endocrina)", "Dice que las dietas de moda y extremas (jarabe de arce, grupos sanguíneos, ayunos alternos) provocan efecto rebote por estrés metabólico.", "", "46:04", "https://www.youtube.com/watch?v=eZyrkbxSsSo&t=2764s"], [0, "Suplementos y fármacos", "GLP-1 (Ozempic, Mounjaro)", "✔", "Dra. Laura Bartolomé (endocrina)", "Dice que la inyección no es para dramatizar: es subcutánea, donde haya grasa, con una aguja de 4-6 mm (más corta que la de insulina) y se pone uno mismo en casa.", "", "52:16", "https://www.youtube.com/watch?v=eZyrkbxSsSo&t=3136s"], [0, "Suplementos y fármacos", "GLP-1 (Ozempic, Mounjaro)", "✔", "Dra. Laura Bartolomé (endocrina)", "Dice que estos fármacos no hacen que pierdas solo grasa: con cualquier déficit calórico se pierde también músculo.", "", "56:15", "https://www.youtube.com/watch?v=eZyrkbxSsSo&t=3375s"], [0, "Nutrición", "Ayuno", "●", "Dra. Laura Bartolomé (endocrina)", "Dice que el ayuno intermitente sirve como herramienta puntual (ventana de 8 horas, ayunos de 14) porque se come menos, sin efectos «mágicos»; deja 12-14 horas entre cena y desayuno, pero no está claro que ayunos más largos sean buenos a largo plazo.", "", "59:28", "https://www.youtube.com/watch?v=eZyrkbxSsSo&t=3568s"], [0, "Nutrición", "Picos de glucosa", "●", "Dra. Laura Bartolomé (endocrina)", "Dice que tras algo muy dulce el cuerpo vive la bajada de azúcar casi como una hipoglucemia: por eso a las 2 horas tienes hambre y sueño, y por eso los dulces por la mañana disparan el hambre.", "", "01:02:22", "https://www.youtube.com/watch?v=eZyrkbxSsSo&t=3742s"], [0, "Nutrición", "Pérdida de peso y calorías", "●", "Dra. Laura Bartolomé (endocrina)", "Dice que en su consulta ve más falta de actividad que exceso de comida: muchas mujeres de 25 a 40 y tantos viven en restricción, comen muy poco y su cuerpo baja el gasto.", "", "01:14:52", "https://www.youtube.com/watch?v=eZyrkbxSsSo&t=4492s"], [0, "Sueño", "Horas de sueño", "●", "Dra. Laura Bartolomé (endocrina)", "Dice que el descanso es el hábito más importante: dormir mal engorda, altera leptina y grelina (hambre y saciedad), desajusta cortisol e insulina y empeora la toma de decisiones.", "", "01:15:42", "https://www.youtube.com/watch?v=eZyrkbxSsSo&t=4542s"], [0, "Nutrición", "Hidratos y harinas", "✔", "Dra. Laura Bartolomé (endocrina)", "Dice que la pasta al dente sube menos la glucosa y que lo que importa de los hidratos es la cantidad, ajustada a tu actividad.", "", "01:19:29", "https://www.youtube.com/watch?v=eZyrkbxSsSo&t=4769s"], [0, "Nutrición", "Plantas, fibra y microbiota", "✔", "Dra. Laura Bartolomé (endocrina)", "Toma 2-3 piezas de fruta al día y legumbres con frecuencia: dice que se han demonizado sin razón y aportan antioxidantes, proteína y fibra.", "", "01:22:42", "https://www.youtube.com/watch?v=eZyrkbxSsSo&t=4962s"], [0, "Nutrición", "Dieta mediterránea y antiinflamatoria", "✔", "Dra. Laura Bartolomé (endocrina)", "Dice que el aceite de oliva es la grasa saludable frente a manteca de cerdo o margarina, pero es energía muy concentrada.", "", "01:26:52", "https://www.youtube.com/watch?v=eZyrkbxSsSo&t=5212s"], [0, "Nutrición", "Comer fuera y caprichos", "●", "Dra. Laura Bartolomé (endocrina)", "Dice que los ultraprocesados están diseñados para ser irresistibles, pero de forma puntual (los gusanitos, la tarta de cumpleaños) «no son el demonio»; importan cantidad, frecuencia y hábito, y es peor picar antes de acostarse.", "", "01:29:16", "https://www.youtube.com/watch?v=eZyrkbxSsSo&t=5356s"], [0, "Nutrición", "Carne y embutidos", "✔", "Dra. Laura Bartolomé (endocrina)", "Evita comer carne roja con frecuencia: dice que en los estudios sale mal parada para el riesgo cardiovascular y también para algunos cánceres; mejor carne blanca, sin llevarlo al extremo.", "", "01:34:54", "https://www.youtube.com/watch?v=eZyrkbxSsSo&t=5694s"], [0, "Nutrición", "Proteína", "✔", "Dra. Laura Bartolomé (endocrina)", "Dice que una dieta vegana bien planificada es posible y equilibrada, pero exige más seguimiento y suplementos de vitaminas.", "", "01:34:54", "https://www.youtube.com/watch?v=eZyrkbxSsSo&t=5694s"], [0, "Nutrición", "Carne y embutidos", "✔", "Dra. Laura Bartolomé (endocrina)", "Dice que cuanta menos carne animal, mejor, y dentro de ella aves; la carne a la brasa tampoco es saludable, pero en una barbacoa puntual disfruta sin dramatizar.", "", "01:35:44", "https://www.youtube.com/watch?v=eZyrkbxSsSo&t=5744s"], [0, "Nutrición", "Picoteo y snacks", "●", "Dra. Laura Bartolomé (endocrina)", "Si tomas chocolate, que sea de más del 85 % de cacao (aporta magnesio y selenio) y una onza, no la tableta; evita el chocolate con leche y el blanco.", "", "01:39:00", "https://www.youtube.com/watch?v=eZyrkbxSsSo&t=5940s"], [0, "Nutrición", "Frutos secos y semillas", "●", "Dra. Laura Bartolomé (endocrina)", "Dice que mejor almendras y nueces que cacahuetes, y que el problema de los frutos secos son los salados, fritos o con miel o chocolate; al natural son «fenomenales».", "", "01:41:17", "https://www.youtube.com/watch?v=eZyrkbxSsSo&t=6077s"], [0, "Nutrición", "Almidón resistente", "✔", "Dra. Laura Bartolomé (endocrina)", "Envuelve el hidrato en fibra, grasa y proteína para que haga menos pico; dice que cocer, enfriar y recalentar patata y arroz aumenta el almidón resistente y baja el pico de azúcar.", "", "01:43:35", "https://www.youtube.com/watch?v=eZyrkbxSsSo&t=6215s"], [0, "Nutrición", "Pérdida de peso y calorías", "✔", "Dra. Laura Bartolomé (endocrina)", "Dice que tus calorías se calculan con una fórmula de gasto basal (sexo, edad, talla) multiplicada por un factor de actividad: una mujer pequeña necesita bastante menos que un hombre grande.", "", "01:44:14", "https://www.youtube.com/watch?v=eZyrkbxSsSo&t=6254s"], [0, "Suplementos y fármacos", "Vitamina D", "⚠", "Dra. Laura Bartolomé (endocrina)", "Dice que ve déficit de vitamina D en casi todos sus pa ivo y acabar concentrándote en un nicho «a base de bofetadas».", "", "11:29", "https://www.youtube.com/watch?v=Az2CUHGJKg8&t=689s"], [3, "Idea y validación", "Foco y nicho", "●", "Nicolás Luca de Tena (empresario)", "Si tienes socios y empleados que dependen de ti, no tienes más remedio que enfocarte: «foco, foco, foco»; si haces 16 cosas a la vez, no haces ninguna bien.", "", "18:27", "https://www.youtube.com/watch?v=Az2CUHGJKg8&t=1107s"], [3, "Idea y validación", "Foco y nicho", "●", "Nate Gentile (divulgador tecnológico)", "Dice que el gran talento de Steve Jobs era enfocar: decir «no, no, no» y recortar productos, algo que aporta un valor enorme que poca gente percibe.", "", "07:40", "https://www.youtube.com/watch?v=Az2CUHGJKg8&t=460s"], [3, "Idea y validación", "Empezar con poco riesgo", "●", "Montse Cespedosa (asesora financiera)", "Monta el negocio manteniendo la nómina para no jugártelo todo; si lo arriesgas todo necesitarás un avalista o facturar desde el primer día.", "", "01:29:32", "https://www.youtube.com/watch?v=4Nn5Mi5h4HI&t=5372s"], [3, "Idea y validación", "Empezar con poco riesgo", "●", "Andrés Garza (emprendedor digital)", "Con poco capital, aprende una habilidad de servicios que se monetice rápido y tenga baja barrera de entrada (anuncios en Meta, programación, webs, e-commerce, IA): no te hará millonario, pero te da contactos y experiencia.", "", "17:44", "https://www.youtube.com/watch?v=VQ1ch_vKgWk&t=1064s"], [3, "Idea y validación", "Empezar con poco riesgo", "⚠", "Christian Villar (formador de emprendedores)", "Dice que, sin capital, el «flip» (comprar algo feo y venderlo arreglado) es la mejor forma de capitalizarse, aunque no genera ingresos pasivos.", "Riesgo de ejecución, plazos y financiación; sin datos", "58:04", "https://www.youtube.com/watch?v=QBP8Nmx_m6Q&t=3484s"], [3, "Idea y validación", "Modelos de negocio", "●", "Fabio Serna (marketing de afiliados)", "El mayor inconveniente de vender en Amazon es la inversión inicial: si el primer producto falla, la pérdida puede crecer (márgenes, problemas de envío).", "", "26:13", "https://www.youtube.com/watch?v=A3HdEAwPCHg&t=1573s"], [3, "Idea y validación", "Modelos de negocio", "●", "Fabio Serna (marketing de afiliados)", "Una agencia de marketing parece fácil, pero exige vender, captar clientes y gestionar equipo (quien lo hace solo es un profesional, no una agencia): es buen modelo para facturar más, no para empezar de cero.", "", "30:10", "https://www.youtube.com/watch?v=A3HdEAwPCHg&t=1810s"], [3, "Idea y validación", "Modelos de negocio", "●", "Santiago Niño Becerra (economista)", "Propone «profesionalizar el hobby»: hoy es mejor ser el mejor pintor de paredes del mundo que un mal abogado.", "", "25:01", "https://www.youtube.com/watch?v=jgM3NiRLP5M&t=1501s"], [3, "Equipo y socios", "Emprender en equipo", "●", "Xavier Verdaguer (emprendedor e inversor)", "Dice que «el error es emprender solo»: emprende en equipo y, aunque seas autónomo, ten cómplices que crean en ti incondicionalmente para sobrellevar la soledad del emprendedor.", "", "13:39", "https://www.youtube.com/watch?v=SZ-J7NR0udk&t=819s"], [3, "Equipo y socios", "Emprender en equipo", "●", "Nicolás Luca de Tena (empresario)", "Si tienes 3.000-5.000 € y quieres construir riqueza, no lo hagas solo: necesitas un equipo (con ese presupuesto, amigos y familia); antes decide cuál es el proyecto: inventarlo, copiarlo o dejarte guiar.", "", "43:11", "https://www.youtube.com/watch?v=Az2CUHGJKg8&t=2591s"], [3, "Equipo y socios", "Emprender en equipo", "⚠", "Nicolás Luca de Tena (empresario)", "Dice que, como primer escalón, «vendas» el proyecto a amigos y familia para que trabajen gratis el tiempo suficiente.", "Trabajo gratis por promesas: riesgo laboral; pactarlo por escrito", "58:46", "https://www.youtube.com/watch?v=Az2CUHGJKg8&t=3526s"], [3, "Equipo y socios", "Red de contactos", "●", "José Millán (físico y astrólogo)", "Invierte en habilidades sociales «de las de antes»: en el campo se ve lo que vale tener red (médico, farmacia de guardia, albañil, quién enseña qué).", "", "01:13:47", "https://www.youtube.com/watch?v=Vd6-IkI3niM&t=4427s"], [3, "Equipo y socios", "Delegar", "●", "Nicolás Luca de Tena (empresario)", "Cuando eres a la vez limpiador, comercial y técnico has superado tu «nivel de incompetencia»: dedícate a la estrategia y ficha un equipo profesional.", "", "55:14", "https://www.youtube.com/watch?v=Az2CUHGJKg8&t=3314s"], [3, "Equipo y socios", "Delegar", "●", "Nicolás Luca de Tena (empresario)", "Los fundadores tienden a no dejar nada a nadie (dogmáticos, autoritarios); delegar es imprescindible para crecer, aunque «cuesta sangre».", "", "57:36", "https://www.youtube.com/watch?v=Az2CUHGJKg8&t=3456s"], [3, "Equipo y socios", "Delegar", "●", "Andrés Garza (emprendedor digital)", "Distingue a quien crea valor (contenido) de quien lo administra (edición, calendario, coordinación): rara vez una misma persona hace bien ambas cosas; si haces las dos, quédate con la que mejor se te da y delega la otra.", "", "24:59", "https://www.youtube.com/watch?v=VQ1ch_vKgWk&t=1499s"], [3, "Equipo y socios", "Delegar", "●", "Ramiro Iglesias (fundador de Crescenta)", "Sé honesto con tus límites: quien reestructura bien una empresa puede no valer para dirigirla en 15 países; no todo el mundo vale para todas las etapas de una compañía.", "", "01:30:28", "https://www.youtube.com/watch?v=vU7kzKIcpgo&t=5428s"], [3, "Equipo y socios", "Delegar", "⚠", "Xavier Verdaguer (emprendedor e inversor)", "Conoce el perfil de cada socio (él usa el eneagrama): por ejemplo, alguien fiel pero poco proactivo necesita requerimientos claros; quien delega y quien recibe deben saber qué le cuesta a cada uno.", "El eneagrama carece de validez científica", "01:09:54", "https://www.youtube.com/watch?v=SZ-J7NR0udk&t=4194s"], [3, "Equipo y socios", "Contratar", "●", "Nicolás Luca de Tena (empresario)", "Para contratar bien antes tienes que haberlo hecho mal suficientes veces: casi siempre «te venden una moto», y tras muchas aprendes a preguntar, empatizar y dirigir mejor, incluso a alguien mediocre.", "", "01:00:40", "https://www.youtube.com/watch?v=Az2CUHGJKg8&t=3640s"], [3, "Equipo y socios", "Contratar", "●", "José Millán (físico y astrólogo)", "Al contratar no se fijan en títulos sino en lo que la persona sabe hacer y en su actitud: da igual que el electricista tenga títulos si trabaja bien, limpio y rápido.", "", "01:16:43", "https://www.youtube.com/watch?v=Vd6-IkI3niM&t=4603s"], [3, "Equipo y socios", "Contratar", "●", "Ricardo Salinas Pliego (empresario)", "Paso 3 de su modelo, el «staffing»: decide quién va a operar el negocio; es trabajo en equipo y con mal talento es muy difícil.", "", "28:00", "https://www.youtube.com/watch?v=yB88ugmkV6E&t=1680s"], [3, "Equipo y socios", "Contratar", "●", "Ricardo Salinas Pliego (empresario)", "No contrata CEO sino operadores con «madera»; distingue gestión operativa y asignación de capital, y dice que esta última es la decisión más importante: «si no la controlas, estás amolado».", "", "28:32", "https://www.youtube.com/watch?v=yB88ugmkV6E&t=1712s"], [3, "Equipo y socios", "Liderazgo", "●", "Andrés Garza (emprendedor digital)", "Prefiere resolver los problemas con el equipo antes que dar órdenes: «el experto es la persona del equipo».", "", "44:32", "https://www.youtube.com/watch?v=VQ1ch_vKgWk&t=2672s"], [3, "Equipo y socios", "Liderazgo", "●", "Alejandro Kasuga (consultor Kaizen)", "Sé congruente en solo dos o tres valores y predica con el ejemplo (él eligió puntualidad, trabajo en equipo —mismo uniforme para todos, él incluido— y servicio): los valores no pueden quedarse en un PowerPoint.", "", "01:02:53", "https://www.youtube.com/watch?v=7RoH2XMjJ5Q&t=3773s"], [3, "Equipo y socios", "Liderazgo", "●", "Alejandro Kasuga (consultor Kaizen)", "Practica un liderazgo cercano: en la COVID mandó geles y mascarillas según los convivientes de cada empleado y pagó la gasolina a quien no tenía coche, y eso le ganó la lealtad de su gente.", "", "01:01:43", "https://www.youtube.com/watch?v=7RoH2XMjJ5Q&t=3703s"], [3, "Equipo y socios", "Liderazgo", "●", "Xavier Verdaguer (emprendedor e inversor)", "Recomienda a Simon Sinek: «las empresas son personas», y el liderazgo debe basarse en ellas.", "", "01:00:59", "https://www.youtube.com/watch?v=SZ-J7NR0udk&t=3659s"], [3, "Equipo y socios", "Liderazgo", "●", "Rodrigo Macías (numerólogo)", "Aunque las decisiones se tomen en común, que alguien tome la última, porque equivocarse también enseña.", "", "01:44:08", "https://www.youtube.com/watch?v=kFfW86o1SQ4&t=6248s"], [3, "Equipo y socios", "Liderazgo", "⚠", "Xavier Verdaguer (emprendedor e inversor)", "Sé muy transparente con el equipo: cuando no podía pagar las nóminas lo dijo y ofreció irse o quedarse a cambio de participación; se quedó la mitad.", "Impago de nóminas con implicaciones legales; consultar abogado", "16:45", "https://www.youtube.com/watch?v=SZ-J7NR0udk&t=1005s"], [3, "Equipo y socios", "Feedback y evaluación", "●", "Ricardo Salinas Pliego (empresario)", "Dedica mucho tiempo a tus operadores: evaluación anual con bonos y feedback; los que no funcionan se van, normalmente por llegar a su nivel de incompetencia.", "", "29:50", "https://www.youtube.com/watch?v=yB88ugmkV6E&t=1790s"], [3, "Equipo y socios", "Feedback y evaluación", "⚠", "Xavier Verdaguer (emprendedor e inversor)", "Daos feedback entre socios una vez al mes con el método «sándwich» (positivo-negativo-positivo), en un momento receptivo y nunca en caliente.", "Eficacia del método sándwich discutida; puede diluir el mensaje", "01:10:45", "https://www.youtube.com/watch?v=SZ-J7NR0udk&t=4245s"], [3, "Ventas y marketing", "Saber vender", "●", "Ricardo Salinas Pliego (empresario)", "Dice que la habilidad más importante es vender («vender cotiza en bolsa»): siempre vendes tu persona, tu idea o tu proyecto, y si no sabes vender «estás muerto».", "", "01:02:43", "https://www.youtube.com/watch?v=yB88ugmkV6E&t=3763s"], [3, "Ventas y marketing", "Saber vender", "●", "Christian Villar (formador de emprendedores)", "Toma acción y llama a puertas: lo peor que puede pasar es que te rechacen.", "", "35:43", "https://www.youtube.com/watch?v=QBP8Nmx_m6Q&t=2143s"], [3, "Ventas y marketing", "Saber vender", "●", "Andrés Garza (emprendedor digital)", "Quien te contrata no compra el entregable (la miniatura) sino el resultado (el clic): mientras ayudes al cliente a lograr sus objetivos, tendrás trabajo.", "", "39:52", "https://www.youtube.com/watch?v=VQ1ch_vKgWk&t=2392s"], [3, "Ventas y marketing", "Saber vender", "●", "Fabio Serna (marketing de afiliados)", "Vende a quien tiene capacidad de comprar.", "", "20:08", "https://www.youtube.com/watch?v=A3HdEAwPCHg&t=1208s"], [3, "Ventas y marketing", "Saber vender", "●", "Fausto Murillo (entrenador)", "Si nadie quiere pagar tu servicio, vende productos asociados a tus clientes: él vendía camisetas, gorras, leggings y bandas elásticas a sus alumnos y «ganaba dinero de ellos sin cobrarles».", "", "01:23:00", "https://www.youtube.com/watch?v=FF-onKxmDhI&t=4980s"], [3, "Ventas y marketing", "Lenguaje no verbal", "●", "Bárbara Tijerina (experta en comunicación no verbal)", "Primera regla al vender: manos siempre a la vista; con las manos escondidas cambia todo el mensaje (ejemplo de Shark Tank).", "", "09:07", "https://www.youtube.com/watch?v=urfzGB-R1vo&t=547s"], [3, "Ventas y marketing", "Lenguaje no verbal", "●", "Bárbara Tijerina (experta en comunicación no verbal)", "El lenguaje no verbal es un «traje a medida»: el vendedor debe leer si el cliente quiere hablar, escuchar o ser acompañado.", "", "59:32", "https://www.youtube.com/watch?v=urfzGB-R1vo&t=3572s"], [3, "Ventas y marketing", "Negociación", "●", "Bárbara Tijerina (experta en comunicación no verbal)", "Ante una palabra agresiva en una negociación o venta, respira antes de contestar: transmite que tomas en serio la pregunta.", "", "31:33", "https://www.youtube.com/watch?v=urfzGB-R1vo&t=1893s"], [3, "Ventas y marketing", "Negociación", "●", "Bárbara Tijerina (experta en comunicación no verbal)", "Negocia paseando con el otro empresario: caminando se es más creativo y se quitan barreras, estrés y pose.", "", "01:22:45", "https://www.youtube.com/watch?v=urfzGB-R1vo&t=4965s"], [3, "Ventas y marketing", "Negociación", "●", "Juan Vizuete (experto en comunicación)", "Antes de una reunión o conversación importante, investiga un poco en redes a la otra persona y busca un interés común (golf, motos) del que hablar.", "", "07:48", "https://www.youtube.com/watch?v=jb7UlgYrHIo&t=468s"], [3, "Ventas y marketing", "Negociación", "●", "Juan Vizuete (experto en comunicación)", "Negocia buscando el mejor acuerdo para ambas partes: «la vida es muy larga» y quien gana todo una vez no vuelve a sentar a la otra parte.", "", "11:15", "https://www.youtube.com/watch?v=jb7UlgYrHIo&t=675s"], [3, "Ventas y marketing", "Pitch y presentaciones", "●", "Xavier Verdaguer (emprendedor e inversor)", "Comunicar bien la idea a inversores, clientes y equipo forma parte de la creatividad y se aprende con metodología.", "", "01:21:43", "https://www.youtube.com/watch?v=SZ-J7NR0udk&t=4903s"], [3, "Ventas y marketing", "Pitch y presentaciones", "●", "Gonzalo Alonso (exdirectivo de Google)", "Antes de presentar una idea a un grupo de gente brillante, cuestiónala tú con pensamiento crítico: la capacidad de transmitirla define el éxito.", "", "01:03:56", "https://www.youtube.com/watch?v=JRchLV0sGaY&t=3836s"], [3, "Ventas y marketing", "Pitch y presentaciones", "●", "Alejandro Kasuga (consultor Kaizen)", "Haz las conferencias dinámicas: muchas diapositivas, humor y vídeos, y conecta con el público al que hablas.", "", "31:07", "https://www.youtube.com/watch?v=7RoH2XMjJ5Q&t=1867s"], [3, "Ventas y marketing", "Storytelling y marca", "●", "Juan Vizuete (experto en comunicación)", "Todo el mundo tiene una historia (un problema resuelto del que sacó una vivencia): no hace falta una épica, la historia cotidiana conecta y vende.", "", "55:19", "https://www.youtube.com/watch?v=jb7UlgYrHIo&t=3319s"], [3, "Ventas y marketing", "Storytelling y marca", "●", "Gonzalo Alonso (exdirectivo de Google)", "Las marcas de lujo (Louis Vuitton, relojes) no venden solo el artículo: venden la historia, la artesanía y la conexión humana.", "", "47:55", "https://www.youtube.com/watch?v=JRchLV0sGaY&t=2875s"], [3, "Ventas y marketing", "Embudo y afiliación", "●", "Fabio Serna (marketing de afiliados)", "Empieza por entender los fundamentos del marketing y del comportamiento de las personas, empezando por el embudo de ventas (funnel).", "", "43:41", "https://www.youtube.com/watch?v=A3HdEAwPCHg&t=2621s"], [3, "Ventas y marketing", "Embudo y afiliación", "●", "Fabio Serna (marketing de afiliados)", "Para empezar en afiliación, lo más simple es recomendar algo que ya conoces y monetizarlo; después elige un nicho que te guste (por ejemplo, finanzas) y promociona sus formaciones.", "", "56:29", "https://www.youtube.com/watch?v=A3HdEAwPCHg&t=3389s"], [3, "Ventas y marketing", "Contenido en redes", "●", "Andrés Garza (emprendedor digital)", "Cualquiera con conocimiento o un negocio pequeño puede usar las redes sociales como canal de distribución, pero la base es saber algo: «crear, administrar y multiplicar».", "", "07:48", "https://www.youtube.com/watch?v=VQ1ch_vKgWk&t=468s"], [3, "Ventas y marketing", "Contenido en redes", "●", "Charly Sinewan (youtuber de viajes)", "Al empezar en YouTube, ten mucho cuidado con la comunidad que creas, porque «vas a ser esclavo de ella»: a él lo identificaban como nómada cuando ya no quería serlo.", "", "56:15", "https://www.youtube.com/watch?v=goK6aVg1BT0&t=3375s"], [3, "Ventas y marketing", "Contenido en redes", "●", "Charly Sinewan (youtuber de viajes)", "No profesionalices ni compliques un canal desde el principio: abre puertas (invitaciones, experiencias), pero exige muchas horas.", "", "02:26:30", "https://www.youtube.com/watch?v=goK6aVg1BT0&t=8790s"], [3, "Ventas y marketing", "Contenido en redes", "●", "Patricio Ochoa (médico)", "Itera sin fallar un solo día: publica, analiza por qué no funciona, añade elementos visuales y cambia el estilo (por ejemplo, cuaderno en vez de pizarra).", "", "32:09", "https://www.youtube.com/watch?v=aLhmN8sdTCg&t=1929s"], [3, "Ventas y marketing", "Contenido en redes", "●", "Tito Vivas (egiptólogo y divulgador)", "Si divulgas, sé entretenido pero no condescendiente ni paternalista: decirle a alguien que está equivocado hace que se cierre.", "", "21:54", "https://www.youtube.com/watch?v=KPUcCvEMbyM&t=1314s"], [3, "Ventas y marketing", "Contenido en redes", "●", "José Millán (físico y astrólogo)", "Reconoce que lo que vende es el clickbait y el miedo: un vídeo que dice «todo irá bien» no lo abre nadie.", "", "32:18", "https://www.youtube.com/watch?v=Vd6-IkI3niM&t=1938s"], [3, "Ventas y marketing", "Contenido en redes", "⚠", "Charly Sinewan (youtuber de viajes)", "Dice que entre el 65 y el 70 % de las visualizaciones de sus vídeos ya son en televisión: «YouTube empieza a ser la televisión».", "Cifra de su propio canal, sin mostrar datos", "01:33:42", "https://www.youtube.com/watch?v=goK6aVg1BT0&t=5622s"], [3, "Ventas y marketing", "Contenido en redes", "⚠", "Rodrigo Macías (numerólogo)", "Dice que no mandes tus vídeos a familia y amigos para que den «me gusta» y los cierren, porque el algoritmo lo lee como mala señal; deja que encuentre a la persona correcta.", "Funcionamiento del algoritmo afirmado sin fuente", "40:57", "https://www.youtube.com/watch?v=kFfW86o1SQ4&t=2457s"], [3, "Gestión y crecimiento", "Estructura del negocio", "●", "Ricardo Salinas Pliego (empresario)", "Paso 1 de su modelo de seis pasos para desarrollar negocios: la estrategia, qué haces y por qué, pensando siempre en el cliente.", "", "25:52", "https://www.youtube.com/watch?v=yB88ugmkV6E&t=1552s"], [3, "Gestión y crecimiento", "Estructura del negocio", "●", "Ricardo Salinas Pliego (empresario)", "Paso 2: la estructura organizativa (ingeniería, marketing y, sobre todo, ventas organizadas por territorio, porque no se vende igual en cada zona).", "", "27:17", "https://www.youtube.com/watch?v=yB88ugmkV6E&t=1637s"], [3, "Gestión y crecimiento", "Indicadores", "●", "Ricardo Salinas Pliego (empresario)", "Paso 4: un sistema de información con las métricas propias de cada negocio, diario y en tiempo real con corte semanal; nada de esperar a informes mensuales o trimestrales.", "", "30:12", "https://www.youtube.com/watch?v=yB88ugmkV6E&t=1812s"], [3, "Gestión y crecimiento", "Indicadores", "●", "Alejandro Kasuga (consultor Kaizen)", "En lugar de organigrama, haz un «flujograma»: cada puesto se mide por lo que entrega al siguiente (por ejemplo, entregar el informe a cobros antes de las 5 de la tarde es el indicador de desempeño).", "", "55:00", "https://www.youtube.com/watch?v=7RoH2XMjJ5Q&t=3300s"], [3, "Gestión y crecimiento", "Mejora continua", "●", "Alejandro Kasuga (consultor Kaizen)", "Antes de la mejora continua (Kaizen) estabiliza los procesos, igual que el médico estabiliza las constantes antes de operar.", "", "56:06", "https://www.youtube.com/watch?v=7RoH2XMjJ5Q&t=3366s"], [3, "Gestión y crecimiento", "Mejora continua", "●", "Alejandro Kasuga (consultor Kaizen)", "Para reestructurar una empresa, empieza por la disciplina visual con las 5S (marcar con cinta dónde va cada objeto, quitar objetos personales) y después ordena los procesos.", "", "52:53", "https://www.youtube.com/watch?v=7RoH2XMjJ5Q&t=3173s"], [3, "Gestión y crecimiento", "Mejora continua", "●", "Alejandro Kasuga (consultor Kaizen)", "El Kaizen fracasa si se va al método sin trabajar la conciencia: el miedo a la burla frena las ideas, y quien hace el trabajo diario es el experto.", "", "56:55", "https://www.youtube.com/watch?v=7RoH2XMjJ5Q&t=3415s"], [3, "Gestión y crecimiento", "Mejora continua", "●", "Alejandro Kasuga (consultor Kaizen)", "Practica la mejora reactiva: cuando alguien comete un error, que proponga una mejora para que no se repita.", "", "55:34", "https://www.youtube.com/watch?v=7RoH2XMjJ5Q&t=3334s"], [3, "Gestión y crecimiento", "Mejora continua", "⚠", "Alejandro Kasuga (consultor Kaizen)", "Dice que a las empresas muy pequeñas no les compensa documentar procesos, porque cambian rápido y mantener manuales cuesta tiempo y dinero; prefiere el liderazgo con el ejemplo.", "Contradice la práctica de documentar los procesos clave", "58:58", "https://www.youtube.com/watch?v=7RoH2XMjJ5Q&t=3538s"], [3, "Gestión y crecimiento", "Escalar", "●", "Ricardo Salinas Pliego (empresario)", "Primero una buena idea de servicio; luego crece replicándola en más territorios (barrio, ciudades, otros países) con la misma solución para el cliente.", "", "35:08", "https://www.youtube.com/watch?v=yB88ugmkV6E&t=2108s"], [3, "Gestión y crecimiento", "Escalar", "⚠", "Ricardo Salinas Pliego (empresario)", "Dice que sacar la empresa a bolsa solo tiene sentido para vender todo («cash out total»).", "Afirmación absoluta; no es una regla general", "47:26", "https://www.youtube.com/watch?v=yB88ugmkV6E&t=2846s"], [3, "Gestión y crecimiento", "Financiación", "✔", "Montse Cespedosa (asesora financiera)", "Para abrir un negocio, tira de préstamos ICO u otros más baratos: el Instituto de Crédito Oficial, entidad pública, facilita que los bancos financien a emprendedores.", "", "01:28:57", "https://www.youtube.com/watch?v=4Nn5Mi5h4HI&t=5337s"], [3, "Gestión y crecimiento", "Financiación", "●", "Nicolás Luca de Tena (empresario)", "«No necesitas 300.000 euros hasta que los necesitas»: tener que levantar capital antes de empezar puede indicar que hay que darle otra vuelta al negocio.", "", "47:35", "https://www.youtube.com/watch?v=Az2CUHGJKg8&t=2855s"], [3, "Gestión y crecimiento", "Financiación", "●", "Nicolás Luca de Tena (empresario)", "No vayas directo a pedir capital semilla sin asesorarte: muchos jóvenes malvenden una parte de su proyecto «por cuatro duros», y duele más si luego triunfa.", "", "45:27", "https://www.youtube.com/watch?v=Az2CUHGJKg8&t=2727s"], [3, "Gestión y crecimiento", "Propósito", "●", "Xavier Verdaguer (emprendedor e inversor)", "Lee el propósito de la empresa antes de cada reunión para no desviarte: «el propósito es lo que te hace levantarte cada día y superar las crisis».", "", "01:05:07", "https://www.youtube.com/watch?v=SZ-J7NR0udk&t=3907s"], [3, "Gestión y crecimiento", "Productividad", "●", "Álvaro Hernández Jarque (experto en productividad)", "Mide en qué se te va el tiempo («lo que no puedes medir no lo puedes mejorar») y luego decide qué eliminar, qué delegar, qué sistematizar o automatizar y qué hacer tú.", "", "22:26", "https://www.youtube.com/watch?v=I4s5bFyCD6E&t=1346s"], [3, "Gestión y crecimiento", "Productividad", "●", "Álvaro Hernández Jarque (experto en productividad)", "Agrupa el trabajo en bloques temáticos por día (ventas, finanzas, estrategia…) para evitar el coste de cambiar de contexto.", "", "26:59", "https://www.youtube.com/watch?v=I4s5bFyCD6E&t=1619s"], [3, "Gestión y crecimiento", "Productividad", "●", "Álvaro Hernández Jarque (experto en productividad)", "Separa la productividad personal (libreta) de la de equipo (Notion, Trello y Slack para comunicar); él usa un tablero Kanban en Notion con sus editores: idea, guion, grabación, publicación y análisis.", "", "01:28:02", "https://www.youtube.com/watch?v=I4s5bFyCD6E&t=5282s"], [3, "Mentalidad del emprendedor", "Perfil del emprendedor", "●", "Xavier Verdaguer (emprendedor e inversor)", "El emprendedor de éxito es inconformista, inquieto e incansable: no emprendas en algo solo porque parezca rentable, elige un problema que te motive.", "", "01:13", "https://www.youtube.com/watch?v=SZ-J7NR0udk&t=73s"], [3, "Mentalidad del emprendedor", "Perfil del emprendedor", "●", "Ricard Gutiérrez (analista financiero)", "Emprender es «durísimo» (24 horas, 365 días), pero es una vía para llegar más arriba.", "", "01:33:47", "https://www.youtube.com/watch?v=79Ypa2k36gk&t=5627s"], [3, "Mentalidad del emprendedor", "Perfil del emprendedor", "●", "Nicolás Luca de Tena (empresario)", "Todo empresario debe pasar por «una dosis suficientemente desagradable de barro»: todo tiene un precio, y para ganar dinero hay que dar algo a cambio.", "", "24:13", "https://www.youtube.com/watch?v=Az2CUHGJKg8&t=1453s"], [3, "Mentalidad del emprendedor", "Perfil del emprendedor", "●", "Nicolás Luca de Tena (empresario)", "«La gente que se queja nunca puede ser emprendedor»: si te quejas de los colaboradores, del cliente o de la mala suerte, dedícate a otra cosa.", "", "01:00:06", "https://www.youtube.com/watch?v=Az2CUHGJKg8&t=3606s"], [3, "Mentalidad del emprendedor", "Perfil del emprendedor", "●", "Nicolás Luca de Tena (empresario)", "Ojo con el exceso de confianza: el éxito en los negocios le hizo creerse un crack invirtiendo y recibió «bofetada tras bofetada».", "", "01:24:23", "https://www.youtube.com/watch?v=Az2CUHGJKg8&t=5063s"], [3, "Mentalidad del emprendedor", "Perfil del emprendedor", "●", "Xavier Verdaguer (emprendedor e inversor)", "Emprender en EE. UU. es «como ir a la NBA»: si sale mal pierdes mucho dinero, sin paro ni sanidad, y hay mucho burnout por la cultura de productividad extrema.", "", "48:32", "https://www.youtube.com/watch?v=SZ-J7NR0udk&t=2912s"], [3, "Mentalidad del emprendedor", "Dinero como consecuencia", "●", "Nicolás Luca de Tena (empresario)", "El beneficio es consecuencia de lo que haces, no el objetivo: quien se propone ganar 5 millones en 3 años a los 22 «va de cabeza»; el dinero llega por hacer algo que la gente quiera comprar.", "", "20:20", "https://www.youtube.com/watch?v=Az2CUHGJKg8&t=1220s"], [3, "Mentalidad del emprendedor", "Dinero como consecuencia", "●", "Andrés Garza (emprendedor digital)", "Trabajar duro es el requisito mínimo, no un extra: lo importante es cómo aportar más valor para que te recompensen mejor.", "", "10:22", "https://www.youtube.com/watch?v=VQ1ch_vKgWk&t=622s"], [3, "Mentalidad del emprendedor", "Resiliencia y críticas", "●", "Ricardo Salinas Pliego (empresario)", "Para recuperarte de los errores hacen falta carácter y resiliencia: mucha tolerancia al fracaso y a la frustración, y no darte por vencido.", "", "17:57", "https://www.youtube.com/watch?v=yB88ugmkV6E&t=1077s"], [3, "Mentalidad del emprendedor", "Resiliencia y críticas", "●", "Ricardo Salinas Pliego (empresario)", "«El no ya lo tienes»: ve a por el sí y busca cómo sí.", "", "13:52", "https://www.youtube.com/watch?v=yB88ugmkV6E&t=832s"], [3, "Mentalidad del emprendedor", "Resiliencia y críticas", "●", "Fausto Murillo (entrenador)", "Si creas contenido, no hagas caso a quienes critican: si él se hubiera parado por los insultos racistas no habría llegado donde está.", "", "01:05:48", "https://www.youtube.com/watch?v=FF-onKxmDhI&t=3948s"], [3, "Mentalidad del emprendedor", "Resiliencia y críticas", "●", "Lama Rinchen Gyaltsen (maestro budista)", "Los pioneros necesitan piel dura y confianza en lo que persiguen, porque las críticas desvían del camino.", "", "36:07", "https://www.youtube.com/watch?v=lghqOjp1DpA&t=2167s"], [3, "Mentalidad del emprendedor", "Pensar en grande", "●", "Christian Villar (formador de emprendedores)", "«Piensa en grande, pero empieza en pequeño»: piensa en generar millones y empieza con 1.000; apuntar bajo y acertar es lo peor.", "", "31:22", "https://www.youtube.com/watch?v=QBP8Nmx_m6Q&t=1882s"], [3, "Mentalidad del emprendedor", "Pensar en grande", "●", "Christian Villar (formador de emprendedores)", "Cambia «no me lo puedo permitir» por «¿cómo me lo puedo permitir?» y haz una lista de tus habilidades para buscar dónde ganar dinero con ellas.", "", "23:24", "https://www.youtube.com/watch?v=QBP8Nmx_m6Q&t=1404s"], [3, "Mentalidad del emprendedor", "Pensar en grande", "●", "Fausto Murillo (entrenador)", "Nunca es tarde para empezar: él se ha comprado equipo para hacer directos como streamer a su edad.", "", "01:08:37", "https://www.youtube.com/watch?v=FF-onKxmDhI&t=4117s"], [3, "Mentalidad del emprendedor", "Pensar en grande", "⚠", "Xavier Verdaguer (emprendedor e inversor)", "«Emprende ahora»: dice que con la IA se es más productivo y se puede conciliar mejor.", "Promesa optimista; la productividad no es automática", "49:22", "https://www.youtube.com/watch?v=SZ-J7NR0udk&t=2962s"], [3, "Mentalidad del emprendedor", "Formación", "●", "Alejandro Kasuga (consultor Kaizen)", "El título universitario es «un boletito de entrada»: abre puertas, pero una vez dentro todo depende de la actitud.", "", "46:29", "https://www.youtube.com/watch?v=7RoH2XMjJ5Q&t=2789s"], [3, "Mentalidad del emprendedor", "Formación", "●", "Mesa redonda Debasa, Gutiérrez y Jiménez (historiador, economista y periodista)", "A la universidad se va a ser universitario y hacer ciencia, no a hacerse millonario: no enseña a emprender ni cultura económica, así que búscala por tu cuenta.", "", "17:03", "https://www.youtube.com/watch?v=sVq6afx2cyY&t=1023s"], [3, "Mentalidad del emprendedor", "Formación", "●", "Santiago Niño Becerra (economista)", "La formación está al alcance de todos (YouTube): fórmate, cultiva contactos y recíclate constantemente; un contacto te abre la puerta, pero no te garantiza quedarte.", "", "25:41", "https://www.youtube.com/watch?v=jgM3NiRLP5M&t=1541s"], [3, "Mentalidad del emprendedor", "Formación", "●", "Ramiro Iglesias (fundador de Crescenta)", "«Es más fácil llegar a un sitio cuando sabes a dónde quieres llegar»: él hizo prácticas en tres bancos durante la carrera y eligió optativas orientadas a su objetivo.", "", "37:25", "https://www.youtube.com/watch?v=vU7kzKIcpgo&t=2245s"], [3, "Mentalidad del emprendedor", "Formación", "●", "Yago Heracles (entrenador y emprendedor)", "Cubre tres esferas: la personal (deporte), la laboral (marca personal, negocio) y la del «eterno alumno», estando siempre aprendiendo algo en lo que te sientas incompetente.", "", "12:50", "https://www.youtube.com/watch?v=XZh-unZxSfk&t=770s"], [3, "Mentalidad del emprendedor", "Decidir", "●", "Lama Rinchen Gyaltsen (maestro budista)", "Si no logras resultados, quizá no es que juegues mal sino que juegas el juego equivocado: uno heredado y no elegido conscientemente.", "", "33:58", "https://www.youtube.com/watch?v=lghqOjp1DpA&t=2038s"], [3, "Mentalidad del emprendedor", "Decidir", "●", "Charly Sinewan (youtuber de viajes)", "Nunca va a haber un momento perfecto para parar o dar el salto: él acabó pidiendo a sus socios una tregua de seis meses para viajar.", "", "03:43", "https://www.youtube.com/watch?v=goK6aVg1BT0&t=223s"], [3, "Mentalidad del emprendedor", "Decidir", "⚠", "Andrés Garza (emprendedor digital)", "Usa esta regla: si buscas razones para hacerlo, no lo hagas; si buscas razones para no hacerlo, hazlo; con matices, y sin sustituir al análisis.", "Heurística sin evidencia; él mismo admite matices", "52:43", "https://www.youtube.com/watch?v=VQ1ch_vKgWk&t=3163s"], [2, "Ahorro y presupuesto", "Presupuesto", "●", "Andrés Garza (emprendedor)", "Haz un presupuesto (ingresos, gastos fijos y a dónde se va el dinero) y no te sientas culpable por un gasto que te hace feliz: la razón del gasto debe ser tuya, no ajena.", "", "01:02:27", "https://www.youtube.com/watch?v=VQ1ch_vKgWk&t=3747s"], [2, "Ahorro y presupuesto", "Presupuesto", "●", "Andrés Garza (emprendedor)", "Dice que es mejor un sistema realista, con un 30 % para disfrutar y algo menos de ahorro, que uno irreal que acabas abandonando.", "", "57:53", "https://www.youtube.com/watch?v=VQ1ch_vKgWk&t=3473s"], [2, "Ahorro y presupuesto", "Presupuesto", "●", "David Merino (educador financiero)", "Apunta todos los gastos y revísalos: al contarlos «nos hacemos trampas al solitario» (se olvidan comida, ropa o el seguro del coche) y crees tener dinero para invertir que no tienes; el Excel solo sirve si lo llenas y adaptas tu vida al objetivo.", "", "22:46", "https://www.youtube.com/watch?v=j3nMSM3DyM0&t=1366s"], [2, "Ahorro y presupuesto", "Presupuesto", "●", "Ricard Gutiérrez (analista financiero)", "Lleva un diario, Excel o presupuesto, distingue gastos superfluos de necesarios y mantén los gastos fijos al mínimo: como en una empresa, más gastos fijos te dejan menos margen de maniobra.", "", "01:14:23", "https://www.youtube.com/watch?v=79Ypa2k36gk&t=4463s"], [2, "Ahorro y presupuesto", "Presupuesto", "●", "Joan Tubau (inversor)", "Dice que el Excel de gastos tiene sentido al empezar para ordenar las finanzas; cuando ya sabes que gastas menos de lo que ingresas, basta con revisar de vez en cuando.", "", "01:24:55", "https://www.youtube.com/watch?v=dO_jDNUxVgs&t=5095s"], [2, "Ahorro y presupuesto", "Cuánto ahorrar", "●", "David Merino (educador financiero)", "Ahorra como mínimo un 10 % de lo que ganas (de 1.000 €, 100 €); si no tienes el hábito, al ganar más gastarás más.", "", "17:25", "https://www.youtube.com/watch?v=j3nMSM3DyM0&t=1045s"], [2, "Ahorro y presupuesto", "Cuánto ahorrar", "●", "David Merino (educador financiero)", "Dice que es un error pensar que ahorrar 50 € al mes no sirve: en pocos meses se juntan cantidades útiles y se rompe el círculo vicioso.", "", "18:04", "https://www.youtube.com/watch?v=j3nMSM3DyM0&t=1084s"], [2, "Ahorro y presupuesto", "Cuánto ahorrar", "●", "Ramiro Iglesias (capital privado, Crescenta)", "Dice que ahorrar un tercio de lo que se ingresa es un hábito sano y de sentido común.", "", "01:05:19", "https://www.youtube.com/watch?v=vU7kzKIcpgo&t=3919s"], [2, "Ahorro y presupuesto", "Cuánto ahorrar", "●", "Ricard Gutiérrez (analista financiero)", "En los 30, ahorra todo lo posible con la vista en el largo plazo, aunque reconoce que con sueldos de 1.000-3.000 € «es muy complicado ahorrar».", "", "01:31:31", "https://www.youtube.com/watch?v=79Ypa2k36gk&t=5491s"], [2, "Ahorro y presupuesto", "Cuánto ahorrar", "●", "Joan Tubau (inversor)", "Dice que ahorrar es gastar menos de lo que entra (si entran cinco, gastas cuatro o tres) y que lo que sobra no debe quedarse en el banco, porque la inflación se lo come, sino invertirse a 5-10 años.", "", "31:04", "https://www.youtube.com/watch?v=dO_jDNUxVgs&t=1864s"], [2, "Ahorro y presupuesto", "Cuánto ahorrar", "●", "Andrés Garza (emprendedor)", "Si vives con tus padres, aprovecha para dedicar menos a necesidades y más a ahorro, inversión y habilidades.", "", "01:00:50", "https://www.youtube.com/watch?v=VQ1ch_vKgWk&t=3650s"], [2, "Ahorro y presupuesto", "Cuánto ahorrar", "●", "Santiago Niño Becerra (economista)", "Ahorra «lo máximo posible» y piensa bien antes de comprar, porque el modelo de protección social es insostenible.", "", "01:13:52", "https://www.youtube.com/watch?v=jgM3NiRLP5M&t=4432s"], [2, "Ahorro y presupuesto", "Cuánto ahorrar", "●", "Joan Tubau (inversor)", "Dice que los primeros 1.000 € (y luego los primeros 10.000) son los más difíciles y dan tranquilidad para emprender; mejor financiar tus proyectos con fondos propios que con el banco, y sin ser un FIRE extremo: gasta en unas cosas y recorta a fondo en otras.", "", "28:33", "https://www.youtube.com/watch?v=dO_jDNUxVgs&t=1713s"], [2, "Ahorro y presupuesto", "Págate primero", "●", "Andrés Garza (emprendedor)", "Sigue este orden: paga las necesidades básicas, luego ahorra e invierte («págate primero») y después gasta; las finanzas son más de conducta que de números (cita «La psicología del dinero»).", "", "59:59", "https://www.youtube.com/watch?v=VQ1ch_vKgWk&t=3599s"], [2, "Ahorro y presupuesto", "Págate primero", "●", "Christian Villar (formador en inversión, W.I.T. Academy)", "Dice que no hay que gastarse el sueldo sino crear activos que paguen el estilo de vida: el pobre gasta e invierte lo que sobra; el rico invierte primero y gasta después.", "", "01:06:40", "https://www.youtube.com/watch?v=QBP8Nmx_m6Q&t=4000s"], [2, "Ahorro y presupuesto", "Págate primero", "●", "Christian Villar (formador en inversión, W.I.T. Academy)", "Págate primero: aparta un 20 % para invertir y disfruta el resto; deja trabajar la inversión y empieza a retirar a los 68-70 (cita «Muere con cero»).", "", "01:30:46", "https://www.youtube.com/watch?v=QBP8Nmx_m6Q&t=5446s"], [2, "Ahorro y presupuesto", "Ahorro automático y cuentas", "✔", "David Merino (educador financiero)", "Separa el ahorro con una transferencia automática al cobrar, como hace el Estado con los impuestos: colchón en una cuenta sin tarjeta, ahorro para gastar en otra y ahorro para invertir en el bróker, también automatizado.", "", "01:19:29", "https://www.youtube.com/watch?v=j3nMSM3DyM0&t=4769s"], [2, "Ahorro y presupuesto", "Ahorro automático y cuentas", "✔", "Joan Tubau (inversor)", "Automatiza el envío al bróker de lo que sobra cada mes, porque si no el mes pasa volando y no lo haces.", "", "01:29:04", "https://www.youtube.com/watch?v=dO_jDNUxVgs&t=5344s"], [2, "Ahorro y presupuesto", "Ahorro automático y cuentas", "●", "David Merino (educador financiero)", "Usa varias cuentas o huchas (gastos fijos, ahorro, colchón): con una sola cuenta hay caos y no sabes qué has ahorrado; una persona normal necesitaría unas 4.", "", "01:20:13", "https://www.youtube.com/watch?v=j3nMSM3DyM0&t=4813s"], [2, "Ahorro y presupuesto", "Ahorro con objetivo", "●", "David Merino (educador financiero)", "Ponle «nombre y apellidos» al ahorro (por ejemplo, 600 € para un fin de semana con tus hijos) para mantener la ilusión, porque ahorrar es aburrido y a largo plazo.", "", "19:19", "https://www.youtube.com/watch?v=j3nMSM3DyM0&t=1159s"], [2, "Ahorro y presupuesto", "Ahorro con objetivo", "●", "David Merino (educador financiero)", "Cuando recortes un gasto (por ejemplo dejar de fumar, unos 300 €/mes), decide para qué es ese dinero; si no, «no aparece en ningún sitio».", "", "19:19", "https://www.youtube.com/watch?v=j3nMSM3DyM0&t=1159s"], [2, "Ahorro y presupuesto", "Ahorro con objetivo", "●", "Álvaro Hernández Jarque (productividad)", "Ponte un objetivo económico cuantificable y con fecha (por ejemplo, ahorrar una cifra concreta este año) y ligado a algo que te motive.", "", "57:39", "https://www.youtube.com/watch?v=I4s5bFyCD6E&t=3459s"], [2, "Ahorro y presupuesto", "Recortar gastos", "●", "David Merino (educador financiero)", "Recorta gastos «sin dolor» (menos cenas fuera, pero más disfrutadas); al hacer la «foto» de tus gastos aparecen fugas, como 300 € en comida rápida.", "", "42:29", "https://www.youtube.com/watch?v=j3nMSM3DyM0&t=2549s"], [2, "Ahorro y presupuesto", "Recortar gastos", "●", "David Merino (educador financiero)", "Empieza por gastar menos antes que por ganar más: con un cubo lleno de agujeros, ganar más solo hace que se escape igual; recortar es rápido y depende de ti.", "", "45:33", "https://www.youtube.com/watch?v=j3nMSM3DyM0&t=2733s"], [2, "Ahorro y presupuesto", "Recortar gastos", "●", "Christian Villar (formador en inversión, W.I.T. Academy)", "Dice que todo el mundo puede recortar gastos, incluso mudándose de una ciudad cara a otra más barata: «vivir unos años como nadie lo haría para vivir el resto como nadie podrá».", "", "09:29", "https://www.youtube.com/watch?v=QBP8Nmx_m6Q&t=569s"], [2, "Ahorro y presupuesto", "Recortar gastos", "●", "Christian Villar (formador en inversión, W.I.T. Academy)", "Evita los «gastos hormiga»; él compró una cafetera que amortiza en 5 meses frente al café de fuera.", "", "13:26", "https://www.youtube.com/watch?v=QBP8Nmx_m6Q&t=806s"], [2, "Ahorro y presupuesto", "Recortar gastos", "●", "Ricard Gutiérrez (analista financiero)", "Quédate con un móvil antiguo en vez del último modelo y destina la diferencia a invertir y a formarte.", "", "01:16:42", "https://www.youtube.com/watch?v=79Ypa2k36gk&t=4602s"], [2, "Ahorro y presupuesto", "Compras impulsivas", "✔", "Joan Tubau (inversor)", "Pregúntate cuántas horas o semanas de trabajo te cuesta una compra: si son tres semanas, piensa si de verdad la necesitas.", "", "01:24:05", "https://www.youtube.com/watch?v=dO_jDNUxVgs&t=5045s"], [2, "Ahorro y presupuesto", "Compras impulsivas", "●", "Andrés Garza (emprendedor)", "Ten una lista de deseos y cómprate solo una cosa al mes dentro del presupuesto: así maduras la idea (¿lo quiero o solo ahora?) y frenas el consumismo.", "", "01:04:58", "https://www.youtube.com/watch?v=VQ1ch_vKgWk&t=3898s"], [2, "Ahorro y presupuesto", "Compras impulsivas", "●", "Andrés Garza (emprendedor)", "Si no usarías algo sin el logo, no lo compres; tampoco cambies de coche si el actual está bien solo por expectativas ajenas.", "", "01:03:17", "https://www.youtube.com/watch?v=VQ1ch_vKgWk&t=3797s"], [2, "Ahorro y presupuesto", "Compras impulsivas", "●", "Andrés Garza (emprendedor)", "Dice que el error habitual es querer cosechar antes de sembrar: las redes y las tarjetas de crédito alimentan el deseo de lujos inmediatos.", "", "55:50", "https://www.youtube.com/watch?v=VQ1ch_vKgWk&t=3350s"], [2, "Ahorro y presupuesto", "Compras impulsivas", "●", "Christian Villar (formador en inversión, W.I.T. Academy)", "Desconfía del «me lo merezco»: las compras impulsivas destrozan la economía; no gastes por haber tenido una mala semana.", "", "14:09", "https://www.youtube.com/watch?v=QBP8Nmx_m6Q&t=849s"], [2, "Ahorro y presupuesto", "Mentalidad y para qué ahorrar", "●", "Joan Tubau (inversor)", "Piensa que al ahorrar «compras libertad futura»: el dinero ahorrado te permite decir que no (dejar un trabajo o una relación que no te satisface); el sistema está montado para que compres sin parar.", "", "01:32:28", "https://www.youtube.com/watch?v=dO_jDNUxVgs&t=5548s"], [2, "Ahorro y presupuesto", "Mentalidad y para qué ahorrar", "●", "Joan Tubau (inversor)", "Aprende a decir «suficiente»: importa menos cuánto entra que montar la vida con el dinero que hay y estar satisfecho con ella.", "", "04:32", "https://www.youtube.com/watch?v=dO_jDNUxVgs&t=272s"], [2, "Ahorro y presupuesto", "Mentalidad y para qué ahorrar", "●", "Ricard Gutiérrez (analista financiero)", "Dice que gastar bien es invertir en tiempo con amigos y familia, y que valora más la libertad financiera que el consumo.", "", "01:23:31", "https://www.youtube.com/watch?v=79Ypa2k36gk&t=5011s"], [2, "Ahorro y presupuesto", "Mentalidad y para qué ahorrar", "●", "Charly Sinewan (viajero)", "Dice que la riqueza es lo que tienes frente a lo que necesitas: si necesitaras un barco, estarías arruinado.", "", "01:27:07", "https://www.youtube.com/watch?v=goK6aVg1BT0&t=5227s"], [2, "Ahorro y presupuesto", "Mentalidad y para qué ahorrar", "●", "Ramiro Iglesias (capital privado, Crescenta)", "Dice que la educación financiera tiene tres fases: no ser avaricioso, ser capaz de gastar y compartir.", "", "01:41:33", "https://www.youtube.com/watch?v=vU7kzKIcpgo&t=6093s"], [2, "Ahorro y presupuesto", "Mentalidad y para qué ahorrar", "●", "Joan Tubau (inversor)", "No te vayas de vacaciones caras ni te compres el coche hasta tener fortaleza financiera; el coche de lujo es consecuencia de haber hecho algo con sentido, no un disfraz para redes.", "", "48:53", "https://www.youtube.com/watch?v=dO_jDNUxVgs&t=2933s"], [2, "Ahorro y presupuesto", "Mentalidad y para qué ahorrar", "●", "Luis Alberto Fabra (economista, Registradores)", "Dice que la libertad financiera es subjetiva: calcula el gasto mensual que necesita la vida que quieres, multiplícalo por 12 y busca inversiones que te den esa cantidad.", "", "01:09:56", "https://www.youtube.com/watch?v=RbHV_R6M0QY&t=4196s"], [2, "Ahorro y presupuesto", "Colchón de emergencia", "✔", "David Merino (educador financiero)", "Separa dos ahorros: uno «para gastar» (imprevistos y objetivos cercanos, «ser tu propio banco») y otro «para no tocar» (inversión a 10-20 años); completa primero el colchón que mantenga tu nivel de vida si pierdes el empleo y solo después invierte, porque si todo está invertido una avería te obliga a vender con pérdidas.", "", "35:17", "https://www.youtube.com/watch?v=j3nMSM3DyM0&t=2117s"], [2, "Ahorro y presupuesto", "Colchón de emergencia", "✔", "Ricard Gutiérrez (analista financiero)", "Ten un fondo de emergencia de 5-6 meses de gastos («mínimo 2-3») y lleva a bolsa solo el dinero que no vas a necesitar («piensa que acabas de perderlo»).", "", "56:01", "https://www.youtube.com/watch?v=79Ypa2k36gk&t=3361s"], [2, "Ahorro y presupuesto", "Colchón de emergencia", "✔", "Arnau Ramió (formador en cripto, Learning Heroes)", "Antes de invertir, guarda un colchón intocable de unos 3 meses de gastos y luego el dinero que necesitarás a corto y medio plazo; solo lo que sobra es invertible.", "", "47:58", "https://www.youtube.com/watch?v=dZpfgTtBGjA&t=2878s"], [2, "Ahorro y presupuesto", "Colchón de emergencia", "●", "Joan Tubau (inversor)", "Dice que el colchón ideal es un año de gastos (dos o tres si vas a emprender o arriesgar): empieza por 2-3 meses y, ahorrando el 20 % del sueldo (400 € de 2.000 €), llegarás a un año en 4-5 años.", "", "46:50", "https://www.youtube.com/watch?v=dO_jDNUxVgs&t=2810s"], [2, "Ahorro y presupuesto", "Colchón de emergencia", "●", "Joan Tubau (inversor)", "A los 20, con pocas obligaciones, baja gastos al máximo (sin recortarlo todo) para construir un «búnker financiero» desde el que decidir con tranquilidad.", "", "47:15", "https://www.youtube.com/watch?v=dO_jDNUxVgs&t=2835s"], [2, "Ahorro y presupuesto", "Colchón de emergencia", "●", "Joan Tubau (inversor)", "Dice que con 10.000 € pondría 5.000 en el fondo de emergencia y 5.000 entre formación y una cartera clásica.", "", "38:44", "https://www.youtube.com/watch?v=dO_jDNUxVgs&t=2324s"], [2, "Ahorro y presupuesto", "Colchón de emergencia", "●", "Santiago Niño Becerra (economista)", "Ten una reserva para imprevistos (un frigorífico de 800 €, una caldera rota), sobre todo con hijos: según dice, el 55 % de los españoles no podría afrontar uno; comprar vivienda también puede ser una forma de ahorro.", "", "01:14:39", "https://www.youtube.com/watch?v=jgM3NiRLP5M&t=4479s"], [2, "Ahorro y presupuesto", "Dónde guardar el colchón", "✔", "David Merino (educador financiero)", "Guarda el fondo de emergencia en una cuenta remunerada, mejor sin tarjeta asociada para que no sea fácil de gastar; no iguala la inflación, pero no arriesgas el capital.", "", "01:21:04", "https://www.youtube.com/watch?v=j3nMSM3DyM0&t=4864s"], [2, "Ahorro y presupuesto", "Dónde guardar el colchón", "✔", "Joan Tubau (inversor)", "El dinero que necesites en menos de un año, en un sitio seguro: fondo monetario (rinde cerca del tipo del BCE, 2-3 %), cuenta remunerada, depósito a 1-2 años o cartera muy conservadora; mejor que una cuenta corriente al 0 %.", "", "33:50", "https://www.youtube.com/watch?v=dO_jDNUxVgs&t=2030s"], [2, "Ahorro y presupuesto", "Dónde guardar el colchón", "✔", "Ricard Gutiérrez (analista financiero)", "Para el fondo de emergencia, lo menos arriesgado son fondos monetarios o depósitos; cuidado con la entidad que elijas.", "", "58:42", "https://www.youtube.com/watch?v=79Ypa2k36gk&t=3522s"], [2, "Ahorro y presupuesto", "Dónde guardar el colchón", "●", "Ricardo Salinas Pliego (empresario, Grupo Salinas)", "El dinero que juntas para montar un negocio puede estar en una cuenta remunerada como «estacionamiento temporal».", "", "52:04", "https://www.youtube.com/watch?v=yB88ugmkV6E&t=3124s"], [2, "Ahorro y presupuesto", "Dónde guardar el colchón", "⚠", "Montse Cespedosa (asesora hipotecaria, MC Financial Solutions)", "Mientras ahorras, pon el dinero en un fondo de inversión o en depósitos «sin riesgo».", "un fondo de inversión no es sin riesgo", "40:20", "https://www.youtube.com/watch?v=4Nn5Mi5h4HI&t=2420s"], [2, "Ahorro y presupuesto", "Patrimonio neto", "✔", "Ricard Gutiérrez (analista financiero)", "Mide tu patrimonio neto (lo que tienes menos lo que debes) y procura que sea positivo antes de grandes caprichos: mucha gente tiene dos casas y coches, pero «si pasa algo, ¿dónde está la pasta?».", "", "01:51:58", "https://www.youtube.com/watch?v=79Ypa2k36gk&t=6718s"], [2, "Ahorro y presupuesto", "Activos y pasivos", "●", "David Merino (educador financiero)", "Dice que una inversión mete dinero en tu bolsillo y un pasivo lo saca: unos paneles solares solo son inversión si el ahorro que generan (por ejemplo 100 €/mes) se aparta y se invier ión en bolsa y fondos", "Fondos indexados", "●", "Ricard Gutiérrez (analista financiero)", "Dice que con un índice siempre tienes los valores que lo componen en cada momento, porque entran y salen empresas; él no tocaría un indexado en 20-25 años.", "", "50:11", "https://www.youtube.com/watch?v=79Ypa2k36gk&t=3011s"], [2, "Inversión en bolsa y fondos", "Fondos indexados", "⚠", "Christian Villar (formador en inversión, W.I.T. Academy)", "Para empezar, abre un bróker y compra un ETF del S&P 500 o del Nasdaq; dice que el S&P 500 ha dado «un 10, 12, 15 %».", "la media histórica ronda el 10 % nominal, no 12-15 %", "01:18:26", "https://www.youtube.com/watch?v=QBP8Nmx_m6Q&t=4706s"], [2, "Inversión en bolsa y fondos", "Fondos indexados", "⚠", "Nicolás Luca de Tena (empresario, Next Chance)", "Invierte en fondos y ETF, no por tu cuenta («la autodidacta te la pega»); cita a Buffett: compra el ETF del S&P 500, que según él rinde «un 12-13 %» neto.", "la media histórica ronda el 10 % nominal", "01:26:40", "https://www.youtube.com/watch?v=Az2CUHGJKg8&t=5200s"], [2, "Inversión en bolsa y fondos", "Cartera de largo plazo", "✔", "Joan Tubau (inversor)", "Para medio y largo plazo, cartera clásica 60/40 (60 % renta variable, 40 % renta fija) indexada a todo el mercado global (MSCI World), sin intentar elegir ganadores.", "", "33:50", "https://www.youtube.com/watch?v=dO_jDNUxVgs&t=2030s"], [2, "Inversión en bolsa y fondos", "Cartera de largo plazo", "✔", "Joan Tubau (inversor)", "Diversifica también la renta fija (deuda pública de varios países y algunas grandes empresas): quien compró deuda de Pescanova no cobró el cupón.", "", "35:31", "https://www.youtube.com/watch?v=dO_jDNUxVgs&t=2131s"], [2, "Inversión en bolsa y fondos", "Cartera de largo plazo", "●", "Joan Tubau (inversor)", "Mantén cada activo de la cartera aunque vaya mal una temporada (el oro pasó años sin subir y luego sí) y confía en el papel de cada uno.", "", "40:11", "https://www.youtube.com/watch?v=dO_jDNUxVgs&t=2411s"] as nóminas, contrato, vida laboral, declaración de la renta y extractos.", "", "59:51", "https://www.youtube.com/watch?v=4Nn5Mi5h4HI&t=3591s"], [2, "Vivienda e hipotecas", "Antes de pedir hipoteca", "●", "Montse Cespedosa (asesora hipotecaria, MC Financial Solutions)", "Mejor aportar algo de ahorro que financiar el 100 %: con menos de 35 años se puede conseguir el 95-100 %, pero ella llega como mucho al 95 %.", "", "52:56", "https://www.youtube.com/watch?v=4Nn5Mi5h4HI&t=3176s"], [2, "Vivienda e hipotecas", "Tipo fijo o variable", "✔", "Luis Alberto Fabra (economista, Registradores)", "Explica que con tipo fijo la cuota (por ejemplo 800 €) es la misma todo el préstamo, y con variable suele ser más barata pero sube si sube el Euribor.", "", "17:17", "https://www.youtube.com/watch?v=RbHV_R6M0QY&t=1037s"], [2, "Vivienda e hipotecas", "Tipo fijo o variable", "✔", "Jaime Gil y Joaquín Berral (inversión inmobiliaria, PropHero)", "Si una subida de 200 € en la cuota te impediría pagar, ponla a tipo fijo: tienes que poder pagar aunque los tipos suban al 5-5,5 %.", "", "01:09:28", "https://www.youtube.com/watch?v=lfJXNhkKEmQ&t=4168s"], [2, "Vivienda e hipotecas", "Tipo fijo o variable", "✔", "Montse Cespedosa (asesora hipotecaria, MC Financial Solutions)", "Ten en cuenta la penalización por amortizar una hipoteca fija: hasta un 2 % los 10 primeros años (4.000 € en una hipoteca de 200.000 €).", "", "12:07", "https://www.youtube.com/watch?v=4Nn5Mi5h4HI&t=727s"], [2, "Vivienda e hipotecas", "Tipo fijo o variable", "●", "Montse Cespedosa (asesora hipotecaria, MC Financial Solutions)", "Si sabes de finanzas, recomienda una hipoteca mixta a 10 años (para evitar la penalización del 2 %) y pasarla a fija cuando bajen los tipos; un tramo fijo de solo 3 años «es variable».", "", "01:15:20", "https://www.youtube.com/watch?v=4Nn5Mi5h4HI&t=4520s"], [2, "Vivienda e hipotecas", "Plazo de la hipoteca", "✔", "Montse Cespedosa (asesora hipotecaria, MC Financial Solutions)", "Cuidado con llegar a los 75 años con hipoteca: tendrás que pagarla con la pensión.", "", "01:12:40", "https://www.youtube.com/watch?v=4Nn5Mi5h4HI&t=4360s"], [2, "Vivienda e hipotecas", "Plazo de la hipoteca", "●", "Luis Alberto Fabra (economista, Registradores)", "No tengas miedo a alargar la hipoteca: se firma a 25 años pero se paga en 15 de media, y una vivienda dura 50-100 años.", "", "01:00:14", "https://www.youtube.com/watch?v=RbHV_R6M0QY&t=3614s"], [2, "Vivienda e hipotecas", "Plazo de la hipoteca", "●", "Montse Cespedosa (asesora hipotecaria, MC Financial Solutions)", "Mejor hipoteca a 20-25 años que a 30; aun así, con hipoteca no te «casas» con la vivienda: se puede vender.", "", "42:25", "https://www.youtube.com/watch?v=4Nn5Mi5h4HI&t=2545s"], [2, "Vivienda e hipotecas", "Negociar la hipoteca", "●", "Jaime Gil y Joaquín Berral (inversión inmobiliaria, PropHero)", "Presiona al banco: cuando bajen los tipos, pon tu hipoteca «en subasta» entre bancos, porque el tuyo no te llamará para bajarte el tipo.", "", "37:03", "https://www.youtube.com/watch?v=lfJXNhkKEmQ&t=2223s"], [2, "Vivienda e hipotecas", "Negociar la hipoteca", "●", "Montse Cespedosa (asesora hipotecaria, MC Financial Solutions)", "No mandes la misma hipoteca por varias plataformas ni abras cuatro o cinco carpetas «para generar tensión»: el banco la descarta y dice «siguiente»; y ojo con la tasación gratis, que es del tasador del banco.", "", "01:03:18", "https://www.youtube.com/watch?v=4Nn5Mi5h4HI&t=3798s"], [2, "Vivienda e hipotecas", "Negociar la hipoteca", "●", "Montse Cespedosa (asesora hipotecaria, MC Financial Solutions)", "No ancles la negociación en algo irreal (un 0,5 % para una casa de 300.000 €): el banco responde «siguiente».", "", "01:03:18", "https://www.youtube.com/watch?v=4Nn5Mi5h4HI&t=3798s"], [2, "Vivienda e hipotecas", "Negociar la hipoteca", "●", "Montse Cespedosa (asesora hipotecaria, MC Financial Solutions)", "Con buen perfil y financiando menos del 80 %, puedes conseguir un tipo por debajo del Euribor (por ejemplo 2,5 % con el Euribor al 2,73 %); espera varias ofertas y compáralas.", "", "01:22:46", "https://www.youtube.com/watch?v=4Nn5Mi5h4HI&t=4966s"], [2, "Vivienda e hipotecas", "Seguros vinculados", "✔", "Montse Cespedosa (asesora hipotecaria, MC Financial Solutions)", "Lee la letra pequeña: seguros de vida y hogar y otras vinculaciones; el seguro es moneda de cambio para negociar el tipo con el banco.", "", "01:25:20", "https://www.youtube.com/watch?v=4Nn5Mi5h4HI&t=5120s"], [2, "Vivienda e hipotecas", "Seguros vinculados", "●", "Montse Cespedosa (asesora hipotecaria, MC Financial Solutions)", "A los 25 años el seguro de vida es barato y puede compensar contratarlo a cambio de un tipo más bajo; con 45-50 años y 300.000 € es mucho más caro y quizá no compense: haz la cuenta.", "", "01:26:07", "https://www.youtube.com/watch?v=4Nn5Mi5h4HI&t=5167s"], [2, "Vivienda e hipotecas", "Arras y comprobaciones", "✔", "Montse Cespedosa (asesora hipotecaria, MC Financial Solutions)", "Antes de dar dinero, pide nota simple, certificado energético y certificado de la comunidad de que no hay deudas; en la nota simple mira propietarios, herencias aceptadas e inscritas, embargos, hipotecas y metros reales; si la inmobiliaria no te da la nota simple, olvídate.", "", "57:43", "https://www.youtube.com/watch?v=4Nn5Mi5h4HI&t=3463s"], [2, "Vivienda e hipotecas", "Arras y comprobaciones", "●", "Montse Cespedosa (asesora hipotecaria, MC Financial Solutions)", "Revisa el contrato de arras, porque muchos borradores son abusivos, y pide quitar los seguros de prima única.", "", "18:58", "https://www.youtube.com/watch?v=4Nn5Mi5h4HI&t=1138s"], [2, "Vivienda e hipotecas", "Arras y comprobaciones", "●", "Montse Cespedosa (asesora hipotecaria, MC Financial Solutions)", "Firma arras para reservar la vivienda (si no, se vende en tres días), pacta 90 días hasta la escritura (uno o dos meses no dan para tramitar la hipoteca) y pide la tasación a tu nombre para presentarla a varios bancos.", "", "01:05:54", "https://www.youtube.com/watch?v=4Nn5Mi5h4HI&t=3954s"], [2, "Vivienda e hipotecas", "Tasación y precio", "✔", "Montse Cespedosa (asesora hipotecaria, MC Financial Solutions)", "No pagues más que el valor de tasación (si piden 300.000 € y tasa en 270.000 €, no más de 270.000 € salvo capricho): el banco financia sobre el menor de los dos valores.", "", "01:09:10", "https://www.youtube.com/watch?v=4Nn5Mi5h4HI&t=4150s"], [2, "Vivienda e hipotecas", "Tasación y precio", "✔", "Luis Alberto Fabra (economista, Registradores)", "Documéntate con precios de cierre (escrituras), no con tasaciones ni precios de oferta de los portales, que llevan «espuma»; y ve acompañado en la mayor decisión financiera de tu vida.", "", "01:18:31", "https://www.youtube.com/watch?v=RbHV_R6M0QY&t=4711s"], [2, "Vivienda e hipotecas", "Tasación y precio", "●", "Luis Alberto Fabra (economista, Registradores)", "Dice que pagar un agente del comprador (un 3 %) es «el gasto más inteligente», porque seguramente te lo ahorra en la negociación.", "", "01:19:58", "https://www.youtube.com/watch?v=RbHV_R6M0QY&t=4798s"], [2, "Vivienda e hipotecas", "Tasación y precio", "⚠", "Montse Cespedosa (asesora hipotecaria, MC Financial Solutions)", "Si la tasación sale por encima del precio (compra 250.000 €, tasación 270.000 €) obtienes más financiación, pero dice que pagas impuestos sobre el valor mayor.", "en ITP cuenta el precio o el valor de referencia", "01:11:29", "https://www.youtube.com/watch?v=4Nn5Mi5h4HI&t=4289s"], [2, "Vivienda e hipotecas", "Entrada y gastos de compra", "✔", "Luis Alberto Fabra (economista, Registradores)", "Calcula la entrada real: el 20 % de un piso de 215.000 € son 43.000 €, más unos 20.000 de impuestos y la notaría y el registro, en torno a 70.000 € en total.", "", "49:12", "https://www.youtube.com/watch?v=RbHV_R6M0QY&t=2952s"], [2, "Vivienda e hipotecas", "Entrada y gastos de compra", "✔", "Luis Alberto Fabra (economista, Registradores)", "Cuenta los gastos: en vivienda
