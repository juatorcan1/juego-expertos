ue formarse en IA no es opcional; Covadonga Torres añade no perder el criterio propio, y Ramió vende esa misma formación.", "4|Seguridad y privacidad|Deepfakes y estafas": "Jon Hernández y Covadonga Torres coinciden en informarse y desconfiar: contraseña familiar, cuidado con ceder tu voz y no fiarse de una videollamada.", "4|Seguridad y privacidad|Datos personales": "Alonso avisa de que nuestros datos están muy expuestos, aunque exagera cuando habla del robo de identidad completo.", "4|Seguridad y privacidad|Identidad digital": "Alonso defiende compartir solo el dato imprescindible (sí/no) y dar prioridad a la identidad digital, que es justo el negocio de su empresa.", "4|Tecnología y dispositivos|Uso del móvil": "Coinciden en no empezar el día con el móvil, quitar notificaciones y añadir fricción o bloqueos; Real matiza que no se trata de dejarlo sino de cambiar la relación con él.", "4|Tecnología y dispositivos|Hijos y pantallas": "Covadonga Torres y Sajeeva Hurtado coinciden en que el control es de los padres: control parental, retrasar el móvil y enseñar a elegir a quién seguir.", "4|Tecnología y dispositivos|Papel y digital": "Hernández Jarque y Rojas Estapé coinciden en pensar y anotar primero en papel y digitalizar después.", "4|Tecnología y dispositivos|Kit de emergencia": "Presa recomienda duplicar la carga y la luz (cables, linternas de pila y batería, solar); los minimolinos eólicos son dudosos."};

 <div class="modo" onclick="go('#creer')"><div class="e">🤔</div><h3>¿Te lo crees?</h3><p>60 segundos: ¿respaldado o dudoso? Récord: ${S.record}. Con 100 puntos, sobre extra.</p></div>
 </div><p class="aviso">✔ respaldado por guías o datos · ● opinión del experto · ⚠ dudoso, con el motivo. Tu partida se guarda en este navegador. No sustituye a tu médico ni a tu asesor.</p>`}
function vSobre(a){if(!sobres()){go("");return}
 a.innerHTML=`<button class="back" onclick="go('')">← Inicio</button><div style="text-align:center"><h2>Agita el sobre…</h2><div class="sobre shake" id="sb" style="margin:20px auto">✉️</div><p class="st">Toca para abrirlo</p></div>`;
 document.getElementById("sb").onclick=()=>{if(S.usadosHoy<3)S.usadosHoy++;else S.sobresExtra--;racha();
  const faltan=EXL.filter(e=>!S.album[e.id]);const e=faltan.length&&Math.random()<.75?pick(faltan):pick(EXL);const nuevo=!S.album[e.id];S.album[e.id]=1;
  const nv=e.ids.filter(i=>!S.vistos[i]);const tres=sh(nv.length>=3?nv:e.ids).slice(0,3);tres.forEach(i=>S.vistos[i]=1);S.xp+=nuevo?30:15;guarda();if(nuevo)confeti();
  a.innerHTML=`<button class="back" onclick="go('')">← Inicio</button><div style="max-width:360px;margin:0 auto">${cromo(e,"flip")}</div><h2 style="text-align:center">${nuevo?"¡Cromo nuevo! +30 ⭐":"Repetido, pero con 3 consejos nuevos +15 ⭐"}</h2>${tres.map(tip).join("")}
  <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:12px">${sobres()?`<button class="btn" onclick="ruta()">✉️ Otro sobre (${sobres()})</button>`:""}<button class="btn sec" onclick="go('#ex~${e.id}')">Ver ficha del experto</button><button class="btn sec" onclick="go('#album')">Mi álbum</button></div>`}}
function vAlbum(a){a.innerHTML=`<button class="back" onclick="go('')">← Inicio</button><h2>📒 Mi álbum</h2>`+C.map((c,ci)=>{const es=EXL.filter(e=>e.c===ci);if(!es.length)return"";const t=es.filter(e=>S.album[e.id]).length;
 return`<h3>${ICO[ci]} ${esc(c[0])} · ${t}/${es.length}</h3><div class="album">${es.map(e=>S.album[e.id]?`<div onclick="go('#ex~${e.id}')" style="cursor:pointer">${cromo(e)}</div>`:`<div class="hueco">?</div>`).join("")}</div>`}).join("")}
function vEx(a,id){const e=EX[id];if(!e||!S.album[id]){go('#album');return}const vis=e.ids.filter(i=>S.vistos[i]);
 a.innerHTML=`<button class="back" onclick="go('#album')">← Álbum</button><div style="max-width:360px">${cromo(e)}</div><h2>${vis.length} consejos desbloqueados</h2>${vis.map(tip).join("")}${vis.length<e.ids.length?`<button class="btn sec" id="mas">🔓 Desbloquear 5 más (−10 ⭐)</button>`:""}`;
 const b=document.getElementById("mas");if(b){b.disabled=S.xp<10;b.onclick=()=>{S.xp-=10;e.ids.filter(i=>!S.vistos[i]).slice(0,5).forEach(i=>S.vistos[i]=1);guarda();ruta()}}}
function vRuleta(a){const n=C.length,sec=360/n;const grad=C.map((c,i)=>`${COL[i]} ${i*sec}deg ${(i+1)*sec}deg`).join(",");
 a.innerHTML=`<button class="back" onclick="go('')">← Inicio</button><h2 style="text-align:center">🎡 Ruleta de la vida</h2><p class="st" style="text-align:center">Situaciones descubiertas: ${Object.keys(S.situ).length}</p><div class="flecha"></div><div class="ruleta" id="rl" style="background:conic-gradient(${grad})">${C.map((c,i)=>`<span class="rl" style="transform:rotate(${i*sec+sec/2-90}deg) translate(40px,-7px)">${ICO[i]} ${esc(c[0].split(",")[0])}</span>`).join("")}</div><div style="text-align:center"><button class="btn" id="gira">¡Girar!</button></div><div id="res"></div>`;
 let giro=0;document.getElementById("gira").onclick=function(){this.disabled=true;const ci=Math.floor(Math.random()*n);giro+=360*5+(360-(ci*sec+sec/2))-(giro%360);document.getElementById("rl").style.transform=`rotate(${giro}deg)`;
  setTimeout(()=>{const subs={};D.forEach((d,i)=>{if(d[0]===ci)(subs[d[1]+"|"+d[2]]=subs[d[1]+"|"+d[2]]||[]).push(i)});const keys=Object.keys(subs).filter(k=>subs[k].length>=2);const k=pick(keys);const [t,s]=k.split("|");const ids=sh(subs[k]).slice(0,5);
   const nueva=!S.situ[ci+"|"+k];S.situ[ci+"|"+k]=1;ids.forEach(i=>S.vistos[i]=1);S.xp+=nueva?10:3;racha();guarda();const r=R[ci+"|"+t+"|"+s];
   document.getElementById("res").innerHTML=`<h2>${ICO[ci]} ${esc(s)}</h2><p class="st">${esc(C[ci][0])} · ${esc(t)} · ${nueva?"¡situación nueva! +10 ⭐":"+3 ⭐"}</p>${r?`<div class="tip" style="background:var(--okbg)"><b>En resumen:</b> ${esc(r)}</div>`:""}${ids.map(tip).join("")}`;
   this.disabled=false;this.textContent="Girar otra vez"},3300)}}
function vMemory(a){const es=sh(EXL).slice(0,6);let cartas=[];es.forEach((e,k)=>{const i=pick(e.ids);let t=D[i][5];if(t.length>95)t=t.slice(0,92)+"…";cartas.push({k,ex:1,txt:e.nombre,c:e.c},{k,ex:0,txt:t,i})});cartas=sh(cartas);
 let abiertas=[],pares=0,mov=0,bloq=false;
 a.innerHTML=`<button class="back" onclick="go('')">← Inicio</button><h2>🧩 Memory de expertos</h2><p class="st">Empareja cada experto con su consejo. Movimientos: <b id="mv">0</b></p><div class="mem">${cartas.map((c,j)=>`<div class="mc" data-j="${j}"><div class="in2"><div class="fa">?</div><div class="fb ${c.ex?"ex":""}" ${c.ex?`style="color:${COL[c.c]}"`:""}>${esc(c.txt)}</div></div></div>`).join("")}</div><div id="mres"></div>`;
 a.querySelectorAll(".mc").forEach(el=>el.onclick=()=>{if(bloq||el.classList.contains("up")||el.classList.contains("ok"))return;el.classList.add("up");abiertas.push(el);
  if(abiertas.length===2){mov++;mv.textContent=mov;const [x,y]=abiertas.map(e=>cartas[+e.dataset.j]);
   if(x.k===y.k&&x.ex!==y.ex){abiertas.forEach(e=>{e.classList.remove("up");e.classList.add("ok")});const ti=(x.ex?y:x).i;S.vistos[ti]=1;abiertas=[];pares++;
    document.getElementById("mres").insertAdjacentHTML("beforeend",tip(ti));
    if(pares===6){S.xp+=40;S.sobresExtra++;racha();guarda();confeti();document.getElementById("mres").insertAdjacentHTML("afterbegin",`<h2>¡Completado en ${mov} movimientos! +40 ⭐ y un sobre extra ✉️</h2><button class="btn" onclick="ruta()">Otra partida</button>`)}else guarda()}
   else{bloq=true;setTimeout(()=>{abiertas.forEach(e=>e.classList.remove("up"));abiertas=[];bloq=false},950)}}})}
function vCreer(a,cs){const fil=cs===undefined||cs===""?null:+cs;const pool=sh(D.map((d,i)=>i).filter(i=>D[i][3]!=="●"&&(fil===null||D[i][0]===fil)));
 a.innerHTML=`<button class="back" onclick="go('')">← Inicio</button><h2>🤔 ¿Te lo crees?</h2><p class="st">Tienes 60 segundos y 3 vidas. Lee el consejo y decide si está respaldado por guías y datos o si es dudoso. Con aciertos seguidos el multiplicador sube.</p><div class="chips">${["Todas",...C.map(c=>c[0])].map((c,j)=>`<button class="chip ${(fil===null&&!j)||fil===j-1?"on":""}" onclick="go('#creer~${j?j-1:""}')">${j?ICO[j-1]+" ":""}${esc(c)}</button>`).join("")}</div><div style="text-align:center;margin-top:16px"><button class="btn" id="emp">▶ Empezar</button></div>`;
 document.getElementById("emp").onclick=()=>{let t=60,vidas=3,pts=0,racha2=0,k=0,fallos=[];const fin0=Date.now()+60000;
  function mult(){return racha2>=6?3:racha2>=3?2:1}
  function pinta(fl){const i=pool[k%pool.length],d=D[i];a.innerHTML=`<div class="arc ${fl||""}"><div class="hud"><span>${"❤️".repeat(vidas)}${"🤍".repeat(3-vidas)}</span><span>⭐ ${pts}</span><span>⏱ <b id="tt">${t}</b></span></div><div class="timer"><i id="tb" style="width:${t/60*100}%"></i></div><div class="combo">${mult()>1?"x"+mult()+" combo 🔥":""}</div><div class="quien">${ICO[d[0]]} ${esc(d[4])}</div><div class="frase">«${esc(d[5])}»</div><div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap"><button class="btn sec" id="no" style="min-width:150px">🤨 Dudoso</button><button class="btn" id="si" style="min-width:150px">✅ Respaldado</button></div><p class="st" style="margin-top:10px">Teclado: ← dudoso · → respaldado</p></div>`;
   document.getElementById("si").onclick=()=>resp(true);document.getElementById("no").onclick=()=>resp(false)}
  function resp(dice){const i=pool[k%pool.length],ok=(D[i][3]==="✔")===dice;S.vistos[i]=1;k++;if(ok){racha2++;pts+=10*mult()}else{racha2=0;vidas--;fallos.push(i)}if(vidas<=0)return fin();pinta(ok?"flash-ok":"flash-bad")}
  const iv=setInterval(()=>{t=Math.max(0,Math.ceil((fin0-Date.now())/1000));const tt=document.getElementById("tt"),tb=document.getElementById("tb");if(tt){tt.textContent=t;tb.style.width=t/60*100+"%"}if(t<=0)fin()},250);
  const key=e=>{if(e.key==="ArrowRight")resp(true);if(e.key==="ArrowLeft")resp(false)};document.addEventListener("keydown",key);
  let acabado=false;function fin(){if(acabado)return;acabado=true;clearInterval(iv);document.removeEventListener("keydown",key);const rec=pts>S.record;if(rec)S.record=pts;S.xp+=Math.round(pts/5);let extra="";if(pts>=100){S.sobresExtra++;extra=" · ¡sobre extra ✉️!"}racha();guarda();if(rec||pts>=100)confeti();
   a.innerHTML=`<div class="arc"><div style="font:700 52px Fredoka;color:var(--gold)">${pts}</div><p>${rec?"¡Nuevo récord!":"Récord: "+S.record}${extra}</p><div style="display:flex;gap:10px;justify-content:center"><button class="btn" onclick="ruta()">Jugar otra vez</button><button class="btn sec" onclick="go('')">Inicio</button></div></div>${fallos.length?`<h3>Los que fallaste (aquí está la respuesta):</h3>${fallos.map(tip).join("")}`:""}`}
  pinta()}}

// ---------- preguntas con respuesta objetiva (sin juzgar si es verdad) ----------
function rng(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shR(a,r){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const POR_C=C.map((_,c)=>D.map((d,i)=>i).filter(i=>D[i][0]===c));
function preguntaDe(c,r){r=r||Math.random;for(let n=0;n<20;n++){const i=POR_C[c][Math.floor(r()*POR_C[c].length)],d=D[i];
  if(r()<.6){const otros=shR([...new Set(POR_C[c].map(j=>D[j][4]).filter(x=>x!==d[4]&&x.split("(")[0].trim()!==d[4].split("(")[0].trim()))],r).slice(0,3);
   if(otros.length===3)return{i,txt:"¿Quién lo dijo?",cuerpo:esc(d[5]),ops:shR([d[4],...otros],r),ok:d[4]}}
  const otros=shR([...new Set(POR_C[c].map(j=>D[j][2]).filter(x=>x!==d[2]))],r).slice(0,3);
  if(otros.length===3)return{i,txt:"¿De qué tema habla?",cuerpo:`<b>${esc(d[4])}</b>: ${esc(d[5])}`,ops:shR([d[2],...otros],r),ok:d[2]}}}
function pintaPregunta(cont,q,c,onFin,segs){let t=segs||20,hecho=false;const fin0=Date.now()+t*1000;
 cont.innerHTML=`<div class="arc" style="text-align:left"><div class="hud"><span style="color:${COL[c]}">${ICO[c]} ${esc(C[c][0])}</span><span>⏱ <b id="pt">${t}</b></span></div><div class="timer"><i id="pb" style="width:100%"></i></div><h3 style="margin:8px 0">${q.txt}</h3><div style="font-size:17px;margin:6px 0 12px">${q.cuerpo}</div><div>${q.ops.map((o,j)=>`<button class="chip opc" data-j="${j}" style="display:block;width:100%;text-align:left;margin:6px 0;border-radius:12px;padding:11px 14px">${esc(o)}</button>`).join("")}</div><div id="pfb"></div></div>`;
 const iv=setInterval(()=>{const r=Math.max(0,(fin0-Date.now())/1000);const a=document.getElementById("pt");if(!a){clearInterval(iv);return}a.textContent=Math.ceil(r);document.getElementById("pb").style.width=r/t*100+"%";if(r<=0)resp(-1)},200);
 function resp(j){if(hecho)return;hecho=true;clearInterval(iv);const bien=j>=0&&q.ops[j]===q.ok;S.vistos[q.i]=1;
  cont.querySelectorAll(".opc").forEach(b=>{b.disabled=true;if(q.ops[+b.dataset.j]===q.ok){b.style.background="var(--okbg)";b.style.borderColor="var(--ok)"}else if(+b.dataset.j===j){b.style.background="var(--badbg)";b.style.borderColor="var(--bad)"}});
  document.getElementById("pfb").innerHTML=`<p class="fred" style="font-size:18px;margin:8px 0">${bien?"✅ ¡Correcto!":j<0?"⏰ Se acabó el tiempo":"❌ No era esa"}</p>${tip(q.i)}<button class="btn" id="psig" style="margin-top:8px">Seguir</button>`;
  document.getElementById("psig").onclick=()=>onFin(bien,Math.ceil(Math.max(0,(fin0-Date.now())/1000)))}
 cont.querySelectorAll(".opc").forEach(b=>b.onclick=()=>resp(+b.dataset.j))}
// ---------- ruleta de las 6 coronas ----------
function vCoronas(a){let P={coronas:[],racha:0,vidas:3,pts:0};const n=7,sec=360/n;let giro=0;
 const seg=i=>i<6?COL[i]:"#c2185b";const grad=[...Array(n)].map((_,i)=>`${seg(i)} ${i*sec}deg ${(i+1)*sec}deg`).join(",");
 function tablero(){a.innerHTML=`<button class="back" onclick="go('')">← Inicio</button><h2 style="text-align:center;margin:0">👑 Ruleta de las 6 coronas</h2>
  <div style="display:flex;justify-content:center;gap:8px;margin:10px 0;font-size:26px">${C.map((c,i)=>`<span title="${esc(c[0])}" style="opacity:${P.coronas.includes(i)?1:.25};filter:${P.coronas.includes(i)?"none":"grayscale(1)"}">${ICO[i]}</span>`).join("")}</div>
  <div class="hud" style="max-width:420px;margin:0 auto"><span>${"❤️".repeat(P.vidas)}${"🤍".repeat(3-P.vidas)}</span><span>⭐ ${P.pts}</span><span>Corona: ${"🟡".repeat(P.racha)}${"⚪".repeat(3-P.racha)}</span></div>
  <div class="flecha" style="margin-top:10px"></div><div class="ruleta" id="rc" style="background:conic-gradient(${grad});transform:rotate(${giro}deg)">${[...Array(n)].map((_,i)=>`<span class="rl" style="transform:rotate(${i*sec+sec/2-90}deg) translate(70px,-12px);font-size:22px">${i<6?ICO[i]:"👑"}</span>`).join("")}</div>
  <div style="text-align:center"><button class="btn" id="gc">¡Girar!</button><p class="st">3 aciertos seguidos llenan la barra y te dan una pregunta de corona. Si cae 👑, eliges tú la ciencia.</p></div><div id="zona"></div>`;
  document.getElementById("gc").onclick=gira}
 function gira(){document.getElementById("gc").disabled=true;const k=Math.floor(Math.random()*n);giro+=360*5+(360-(k*sec+sec/2))-(giro%360);document.getElementById("rc").style.transform=`rotate(${giro}deg)`;
  setTimeout(()=>{if(k===6||P.racha>=3)elegir(k===6);else juega(k,false)},3300)}
 function elegir(porRuleta){const libres=[0,1,2,3,4,5].filter(i=>!P.coronas.includes(i));document.getElementById("zona").innerHTML=`<h3 style="text-align:center">${porRuleta?"¡Ha caído la corona!":"¡Barra llena!"} Elige la corona que quieres ganar:</h3><div class="chips" style="justify-content:center">${libres.map(i=>`<button class="chip" data-c="${i}">${ICO[i]} ${esc(C[i][0])}</button>`).join("")}</div>`;
  document.querySelectorAll("#zona .chip").forEach(b=>b.onclick=()=>juega(+b.dataset.c,true))}
 function juega(c,corona){const q=preguntaDe(c);const z=document.getElementById("zona");if(corona)z.insertAdjacentHTML("beforebegin","");pintaPregunta(z,q,c,(bien,resto)=>{
   if(bien){P.pts+=10+resto;if(corona){P.coronas.push(c);P.pts+=50;P.racha=0;confeti();toast("👑 ¡Corona de "+C[c][0]+"!")}else P.racha=Math.min(3,P.racha+1)}
   else{P.vidas--;if(!corona)P.racha=0}
   if(P.coronas.length===6||P.vidas<=0)return fin();tablero();z.scrollIntoView&&0},20);z.scrollIntoView({behavior:"smooth"})}
 function fin(){const gano=P.coronas.length===6;if(gano)P.pts+=200;S.xp+=Math.round(P.pts/4);const rec=P.pts>(S.mejorCoronas||0);if(rec)S.mejorCoronas=P.pts;if(gano||P.pts>=150)S.sobresExtra++;racha();guarda();if(gano||rec)confeti();
  a.innerHTML=`<div class="arc"><div style="font-size:40px">${P.coronas.map(i=>ICO[i]).join("")||"😅"}</div><div style="font:700 52px Fredoka;color:var(--gold)">${P.pts}</div><p>${gano?"¡Has ganado las 6 coronas! +200":"Coronas: "+P.coronas.length+"/6"} · ${rec?"¡Nuevo récord!":"Récord: "+S.mejorCoronas}${gano||P.pts>=150?" · sobre extra ✉️":""}</p><div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap"><button class="btn" onclick="ruta()">Otra partida</button><button class="btn sec" onclick="go('#duelo')">⚔️ Retar a un amigo</button><button class="btn sec" onclick="go('')">Inicio</button></div></div>`}
 tablero()}
// ---------- duelo por enlace (sin servidor) ----------
function vDuelo(a,_,args){const [seedS,rival,ptsS]=(args||[]).map(x=>decodeURIComponent(x||""));const reto=seedS&&rival;
 let nombre="";try{nombre=localStorage.getItem("juegoNombre")||""}catch(e){}
 a.innerHTML=`<button class="back" onclick="go('')">← Inicio</button><h2>⚔️ ${reto?esc(rival)+" te reta":"Reta a un amigo"}</h2>${reto?`<div class="arc" style="margin-bottom:12px"><p style="margin:0">${esc(rival)} ha sacado</p><div style="font:700 44px Fredoka;color:var(--gold)">${+ptsS} pts</div><p class="st">Las mismas 10 preguntas, 15 segundos cada una. Cuanto más rápido aciertes, más puntos.</p></div>`:`<p class="st">Juegas 10 preguntas (15 segundos cada una; cuanto más rápido, más puntos) y al acabar te doy un enlace. Tu amigo juega exactamente las mismas preguntas y ve quién ha ganado.</p>`}
 <p>Tu nombre: <input id="nom" value="${esc(nombre)}" maxlength="20" style="padding:9px 12px;border-radius:10px;border:1.5px solid var(--line);font:16px Inter;background:var(--card);color:var(--ink)"></p><button class="btn" id="emp">▶ ${reto?"Aceptar el reto":"Empezar"}</button><div id="zona" style="margin-top:12px"></div>`;
 document.getElementById("emp").onclick=()=>{nombre=(document.getElementById("nom").value||"Anónimo").trim().slice(0,20);try{localStorage.setItem("juegoNombre",nombre)}catch(e){}
  const seed=reto?+seedS:Math.floor(Math.random()*1e9);const r=rng(seed);const cs=[0,1,2,3,4,5,0,1,2,5].map(x=>x);const qs=cs.map(c=>[c,preguntaDe(c,r)]);let k=0,pts=0,ac=0;const z=document.getElementById("zona");document.getElementById("emp").remove();
  function sig(){if(k>=qs.length)return fin();const [c,q]=qs[k];pintaPregunta(z,q,c,(bien,resto)=>{if(bien){ac++;pts+=10+resto}k++;sig()},15)}
  function fin(){S.xp+=Math.round(pts/4);racha();guarda();const url=location.origin+location.pathname+"#duelo~"+seed+"~"+encodeURIComponent(nombre)+"~"+pts;
   let res="";if(reto){const g=pts>+ptsS,e=pts===+ptsS;res=`<p class="fred" style="font-size:24px">${g?"🏆 ¡Has ganado a "+esc(rival)+"!":e?"🤝 Empate":"😤 Gana "+esc(rival)+"… ¡revancha!"}</p>`;if(g)confeti()}
   z.innerHTML=`<div class="arc">${res}<div style="font:700 52px Fredoka;color:var(--gold)">${pts} pts</div><p>${ac}/10 aciertos</p><p>Manda este enlace para ${reto?"devolverle el reto":"retar a tus amigos"}:</p><input id="lnk" readonly value="${esc(url)}" style="width:100%;padding:10px;border-radius:10px;border:1.5px solid var(--line);font:14px Inter;background:var(--bg);color:var(--ink)"><div style="display:flex;gap:10px;justify-content:center;margin-top:10px;flex-wrap:wrap"><button class="btn" id="cop">📋 Copiar enlace</button><a class="btn sec" style="text-decoration:none" href="https://wa.me/?text=${encodeURIComponent("⚔️ Te reto en El juego de los expertos: he sacado "+pts+" puntos. ¿Me ganas? "+url)}" target="_blank" rel="noopener">WhatsApp</a><button class="btn sec" onclick="go('')">Inicio</button></div></div>`;
   document.getElementById("cop").onclick=async()=>{try{await navigator.clipboard.writeText(url);toast("Enlace copiado")}catch(e){document.getElementById("lnk").select();toast("Selecciónalo y cópialo")}}}
  sig()}}

window.addEventListener("hashchange",ruta);hud();ruta();
</script>
